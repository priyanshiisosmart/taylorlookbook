<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#310f2c">
<meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Speak Now">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%234a1942'/%3E%3Cpath d='M14 50 Q10 34 20 20 Q28 9 42 8 Q40 18 30 24 Q40 22 46 12 Q48 24 38 32 Q30 38 22 38 Q28 40 34 38' fill='none' stroke='%23e8cf8a' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<title>Speak Now · Lookbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Pinyon+Script&family=Cormorant+Garamond:ital,wght@0,500;1,500&family=EB+Garamond:ital@0;1&family=Caveat:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff9f3;
  --curtain:#4a1942;
  --curtain-dark:#310f2c;
  --curtain-shadow:#22091f;
  --accent:#5a2a8a;
  --accent-deep:#3d1a63;
  --gold:#c9a24b;
  --gold-light:#e8cf8a;
  --text:#2b163a;
  --blush:#f3d9e4;
  --paper:#fffaf4;
}

*{margin:0;padding:0;box-sizing:border-box}

body{
  background:var(--bg);
  font-family:'Playfair Display',serif;
  color:var(--text);
  overflow-x:hidden;
  cursor:none;
}

::selection{ background:var(--blush); color:var(--accent-deep); }

.sn-curtain{
  position:fixed;
  inset:0;
  z-index:5000;
  display:flex;
  pointer-events:none;
}

.sn-curtain-half{
  width:50%;
  height:100%;
  background:
    repeating-linear-gradient(90deg,
      rgba(0,0,0,0) 0px,
      rgba(0,0,0,0.16) 18px,
      rgba(0,0,0,0) 36px),
    linear-gradient(180deg, var(--curtain) 0%, var(--curtain-dark) 70%, var(--curtain-shadow) 100%);
  box-shadow: inset 0 0 120px rgba(0,0,0,.55);
  transition: transform 1.4s cubic-bezier(.77,0,.18,1);
  position:relative;
}

.sn-curtain-half::after{
  content:'';
  position:absolute;
  top:0; bottom:0;
  width:40px;
  background:linear-gradient(90deg, rgba(255,255,255,.12), transparent);
}

.sn-curtain-left::after{ right:0; }
.sn-curtain-right::after{ left:0; transform:scaleX(-1); }

.sn-curtain-valance{
  position:absolute;
  top:0; left:0; right:0;
  height:70px;
  background:var(--curtain-dark);
  clip-path:polygon(0% 0%,100% 0%,100% 40%,92% 100%,84% 40%,76% 100%,68% 40%,60% 100%,52% 40%,44% 100%,36% 40%,28% 100%,20% 40%,12% 100%,4% 40%,0% 100%);
  z-index:2;
}

.sn-curtain-label{
  position:absolute;
  top:50%; left:50%;
  transform:translate(-50%,-50%);
  color:var(--gold-light);
  font-family:'Pinyon Script',cursive;
  font-size:44px;
  letter-spacing:1px;
  text-align:center;
  z-index:3;
  text-shadow:0 2px 12px rgba(0,0,0,.5);
}

body.sn-open .sn-curtain-left{ transform:translateX(-100%); }
body.sn-open .sn-curtain-right{ transform:translateX(100%); }
body.sn-open .sn-curtain{ pointer-events:none; }

.sn-replay-curtain{
  position:fixed;
  bottom:max(18px, env(safe-area-inset-bottom) + 10px);
  left:max(18px, env(safe-area-inset-left) + 10px);
  z-index:900;
  background:var(--curtain-dark);
  color:var(--gold-light);
  border:1px solid var(--gold);
  border-radius:20px;
  padding:8px 16px;
  font-family:'Cormorant Garamond',serif;
  font-size:14px;
  letter-spacing:.5px;
  cursor:none;
  opacity:.85;
}
.sn-replay-curtain:hover{ opacity:1; }

.era-nav, .bottom-nav{
  display:flex;
  justify-content:center;
  padding:22px 30px;
}

.nav-btn{
  padding:9px 22px;
  border-radius:24px;
  border:1.5px solid var(--accent);
  text-decoration:none;
  color:var(--accent);
  font-weight:700;
  font-size:15px;
  letter-spacing:.5px;
  transition:.25s;
  cursor:none;
}
.nav-btn:hover{ background:var(--accent); color:#fff; }

.sn-hero-wrap{
  position:relative;
  padding:20px 30px 60px;
  display:flex;
  justify-content:center;
}

.sn-hero-frame{
  position:relative;
  max-width:900px;
  width:100%;
  display:flex;
  gap:44px;
  align-items:center;
  justify-content:center;
  flex-wrap:wrap;
  padding:20px;
}

.sn-cover-frame{
  position:relative;
  padding:14px;
  background:linear-gradient(145deg, var(--gold-light), var(--gold));
  border-radius:10px;
  box-shadow:0 18px 40px rgba(58,20,60,.25);
  flex-shrink:0;
}

.hero-cover{
  width:260px;
  height:260px;
  object-fit:cover;
  border-radius:4px;
  display:block;
  border:3px solid var(--paper);
}

.sn-hero-text{ max-width:420px; }

.era-title{
  font-size:58px;
  color:var(--accent-deep);
  font-weight:700;
  line-height:1;
  margin-bottom:10px;
}

.sn-hero-sub{
  font-family:'Pinyon Script',cursive;
  font-size:26px;
  color:var(--accent);
  margin-bottom:14px;
}

.era-desc{
  font-family:'Cormorant Garamond',serif;
  font-style:italic;
  font-size:20px;
  line-height:1.5;
  color:var(--text);
}

.sn-photo-scatter{
  position:relative;
  width:100%;
  max-width:900px;
  margin:0 auto;
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:18px;
  padding:0 20px 40px;
}

.sn-polaroid{
  background:var(--paper);
  padding:10px 10px 26px;
  box-shadow:0 10px 22px rgba(58,20,60,.18);
  width:130px;
  border-radius:2px;
  transform:rotate(var(--r,0deg));
  transition:.25s;
}
.sn-polaroid:nth-child(1){ --r:-6deg; }
.sn-polaroid:nth-child(2){ --r:4deg;  margin-top:20px; }
.sn-polaroid:nth-child(3){ --r:-3deg; }
.sn-polaroid:nth-child(4){ --r:6deg;  margin-top:14px; }
.sn-polaroid:nth-child(5){ --r:-8deg; }
.sn-polaroid:nth-child(6){ --r:3deg;  margin-top:24px; }
.sn-polaroid:hover{ transform:rotate(0deg) scale(1.06); z-index:5; }
.sn-polaroid img{
  width:100%;
  height:130px;
  object-fit:cover;
  display:block;
  background:var(--blush);
}
.sn-polaroid-caption{
  display:block;
  text-align:center;
  font-family:'Cormorant Garamond',serif;
  font-style:italic;
  font-size:13px;
  color:var(--accent);
  margin-top:8px;
}

.sn-program{
  max-width:1400px;
  margin:0 auto;
  padding:10px 24px 80px;
}

.sn-program-title{
  text-align:center;
  font-size:30px;
  color:var(--accent-deep);
  margin-bottom:6px;
}

.sn-program-sub{
  text-align:center;
  font-family:'Cormorant Garamond',serif;
  font-style:italic;
  color:var(--accent);
  margin-bottom:30px;
}

.sn-tabs{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:30px;
}

.sn-tab{
  padding:9px 20px;
  border-radius:20px;
  border:1.5px solid var(--accent);
  background:transparent;
  color:var(--accent);
  font-family:'Playfair Display',serif;
  font-weight:600;
  font-size:14px;
  cursor:none;
  transition:.2s;
}
.sn-tab.active, .sn-tab:hover{
  background:var(--accent);
  color:#fff;
}

.sn-act{ display:none; }
.sn-act.active{ display:block; }

.sn-act-heading{
  font-family:'Cormorant Garamond',serif;
  font-style:italic;
  font-size:19px;
  color:var(--accent);
  text-align:center;
  margin-bottom:18px;
  padding-bottom:10px;
  border-bottom:1px solid var(--blush);
}

.sn-track-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(130px, 1fr));
  gap:16px;
  width:100vw;
  position:relative;
  left:50%;
  right:50%;
  margin-left:-50vw;
  margin-right:-50vw;
  background-color:transparent;
}

.sn-track{
  display:flex;
  flex-direction:row;
  align-items:center;
  justify-content:center;
  text-align:center;
  gap:6px;
  padding:14px 10px;
  min-height:64px;
  cursor:none;
  transition:.25s;
  position:relative;
  z-index:1;
  border-radius:10px;
  box-shadow:0 6px 16px rgba(34,9,31,.28);
  border:2px solid #2a1147;
  margin:0;
  opacity:1;
  color-scheme:only light;
  forced-color-adjust:none;
  background-clip:padding-box;
}
/* Rotating palette so neighboring tiles read as distinct, separated
   cards rather than one solid block — all dark enough to keep the
   existing white/gold text legible. */
.sn-track:nth-child(6n+1){ background-color:#3d1a63 !important; }
.sn-track:nth-child(6n+2){ background-color:#5a2a8a !important; }
.sn-track:nth-child(6n+3){ background-color:#4a1942 !important; }
.sn-track:nth-child(6n+4){ background-color:#6b2f52 !important; }
.sn-track:nth-child(6n+5){ background-color:#442a63 !important; }
.sn-track:nth-child(6n+6){ background-color:#7a3b62 !important; }
.sn-track:nth-child(6n+1):hover{ background-color:#5a2a8a !important; }
.sn-track:nth-child(6n+2):hover{ background-color:#7438ab !important; }
.sn-track:nth-child(6n+3):hover{ background-color:#63235c !important; }
.sn-track:nth-child(6n+4):hover{ background-color:#8a3d6c !important; }
.sn-track:nth-child(6n+5):hover{ background-color:#5c3980 !important; }
.sn-track:nth-child(6n+6):hover{ background-color:#974a7c !important; }
.sn-track:hover{
  border-color:var(--gold);
  transform:translateY(-2px);
  box-shadow:0 14px 32px rgba(34,9,31,.4);
}

.sn-track-num{
  font-family:'Cormorant Garamond',serif;
  color:var(--gold);
  font-size:13px;
  flex-shrink:0;
}

.sn-track-info{ min-width:0; overflow:hidden; }

.sn-track-title{
  font-size:12px;
  color:var(--paper);
  line-height:1.2;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.sn-track-feature{
  font-family:'Cormorant Garamond',serif;
  font-style:italic;
  font-size:10px;
  color:var(--gold-light);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.sn-track-note{
  font-size:12px;
  color:var(--gold);
  flex-shrink:0;
}

.sn-track-synced{
  display:none;
}

.sn-modal-backdrop{
  position:fixed;
  inset:0;
  background:rgba(34,9,31,.6);
  backdrop-filter:blur(2px);
  z-index:6000;
  display:none;
  align-items:center;
  justify-content:center;
  padding:24px;
}
.sn-modal-backdrop.show{ display:flex; }

.sn-modal{
  position:relative;
  z-index:1;
  background:rgba(255,250,244,.9);
  backdrop-filter:blur(10px) saturate(1.15);
  -webkit-backdrop-filter:blur(10px) saturate(1.15);
  max-width:520px;
  width:100%;
  max-height:85vh;
  border-radius:14px;
  box-shadow:0 30px 70px rgba(0,0,0,.4);
  display:flex;
  flex-direction:column;
  overflow:hidden;
  border:1px solid var(--gold-light);
}

.sn-modal-header{
  padding:22px 26px 14px;
  border-bottom:1px solid var(--blush);
  position:sticky;
  top:0;
  z-index:3;
  background:rgba(255,250,244,.92);
  overflow:hidden;
  flex-shrink:0;
}

.sn-modal-particles{
  position:absolute;
  inset:0;
  overflow:hidden;
  pointer-events:none;
  z-index:0;
}

.sn-particle{
  position:absolute;
  bottom:-10px;
  color:var(--gold);
  opacity:0;
  animation:snParticleFloat linear forwards;
}

@keyframes snParticleFloat{
  0%{ opacity:0; transform:translateY(0) rotate(0deg); }
  12%{ opacity:.85; }
  85%{ opacity:.5; }
  100%{ opacity:0; transform:translateY(-160px) rotate(50deg); }
}

@media (prefers-reduced-motion: reduce){
  .sn-particle{ display:none; }
}

.sn-drag-handle{
  display:none;
  position:absolute;
  top:8px; left:50%;
  transform:translateX(-50%);
  width:38px; height:4px;
  border-radius:3px;
  background:var(--gold);
  opacity:.55;
  z-index:4;
}

@media (max-width:768px){
  .sn-drag-handle{ display:block; }
}

.sn-modal-backdrop.minimized{
  opacity:0;
  pointer-events:none;
}

.sn-mini-player{
  position:fixed;
  left:12px;
  right:12px;
  bottom:max(12px, env(safe-area-inset-bottom) + 8px);
  z-index:6500;
  display:none;
  align-items:center;
  gap:12px;
  background:rgba(255,250,244,.96);
  border:1px solid var(--gold-light);
  border-radius:16px;
  box-shadow:0 12px 30px rgba(34,9,31,.3);
  padding:10px 12px;
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  cursor:pointer;
  touch-action:manipulation;
}
.sn-mini-player.show{ display:flex; }

.sn-mini-play{
  flex-shrink:0;
  width:38px; height:38px;
  border-radius:50%;
  border:1.5px solid var(--accent);
  background:var(--paper);
  color:var(--accent);
  font-size:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}

.sn-mini-info{ flex:1; min-width:0; }
.sn-mini-title{
  font-family:'Cormorant Garamond',serif;
  font-weight:600;
  font-size:15px;
  color:var(--accent-deep);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.sn-mini-hint{
  font-family:'Cormorant Garamond',serif;
  font-style:italic;
  font-size:11px;
  color:var(--accent);
  opacity:.7;
}

.sn-mini-close{
  flex-shrink:0;
  border:none;
  background:none;
  color:var(--accent);
  font-size:16px;
  opacity:.7;
  cursor:pointer;
  padding:6px;
}
.sn-mini-close:hover{ opacity:1; }

.sn-toast{
  position:fixed;
  left:50%;
  bottom:max(90px, env(safe-area-inset-bottom) + 80px);
  transform:translateX(-50%) translateY(12px);
  background:var(--accent-deep);
  color:var(--paper);
  font-family:'Cormorant Garamond',serif;
  font-size:14px;
  padding:9px 18px;
  border-radius:20px;
  opacity:0;
  pointer-events:none;
  transition:opacity .25s ease, transform .25s ease;
  z-index:7000;
}
.sn-toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

.sn-modal-share{
  position:absolute;
  top:16px; right:52px;
  background:none;
  border:none;
  font-size:19px;
  color:var(--accent);
  cursor:pointer;
  touch-action:manipulation;
  line-height:1;
  z-index:5;
  opacity:.85;
}
.sn-modal-share:hover{ opacity:1; }

.sn-modal-close{
  position:absolute;
  top:16px; right:18px;
  background:none;
  border:none;
  font-size:22px;
  color:var(--accent);
  cursor:none;
  line-height:1;
  z-index:5;
}

.sn-modal-title{
  font-size:26px;
  color:var(--accent-deep);
  padding-right:66px;
  position:relative;
  z-index:2;
  pointer-events:none;
}

.sn-modal-feature{
  font-family:'Cormorant Garamond',serif;
  font-style:italic;
  color:var(--accent);
  font-size:15px;
  margin-top:4px;
  position:relative;
  z-index:2;
  pointer-events:none;
}

.sn-modal-body-wrap{
  position:relative;
  flex:1;
  min-height:0;
  overflow:hidden;
  display:flex;
}

.sn-song-canvas{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:0;
  overflow:hidden;
  opacity:0;
  transition:opacity .9s ease;
  will-change:opacity;
}

.sn-modal-body{
  position:relative;
  z-index:1;
  padding:20px 26px;
  overflow-y:auto;
  overscroll-behavior:contain;
  font-family:'EB Garamond',serif;
  font-size:17px;
  line-height:1.9;
  color:var(--text);
  flex:1;
  scroll-behavior:smooth;
}

@keyframes snFloat{0%,100%{transform:translateY(0) rotate(var(--fr,0deg));}50%{transform:translateY(-14px) rotate(var(--fr2,4deg));}}
@keyframes snFall{0%{transform:translateY(-20px) rotate(0deg);opacity:0;}10%{opacity:1;}100%{transform:translateY(280px) rotate(200deg);opacity:0;}}
@keyframes snRise{0%{transform:translateY(0) scale(1);opacity:.8;}100%{transform:translateY(-290px) scale(.3);opacity:0;}}
@keyframes snShake{0%,100%{transform:translateX(0);}20%{transform:translateX(-6px) rotate(-3deg);}40%{transform:translateX(6px) rotate(3deg);}60%{transform:translateX(-4px);}80%{transform:translateX(4px);}}
@keyframes snBolt{0%,100%{opacity:0;}5%,15%{opacity:1;}10%,20%{opacity:0;}}
@keyframes snBubble{0%{transform:translateY(0) scale(1);opacity:.7;}100%{transform:translateY(-200px) scale(1.4);opacity:0;}}
@keyframes snPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.1);}}

.scene-speak-now .sn-petal{position:absolute;animation:snFall linear infinite;opacity:0;}
.scene-speak-now .sn-couple{position:absolute;}
.scene-speak-now .sn-heart-pop{position:absolute;animation:snRise linear infinite;opacity:0;}
.sn-couple.swaying{ animation: snCoupleSway 6s ease-in-out infinite; }
@keyframes snCoupleSway{
  0%,100%{ transform:rotate(-1.5deg); }
  50%{ transform:rotate(1.5deg); }
}
.sn-couple-svg{ width:100%; height:100%; display:block; overflow:visible; }

.sn-couple-art{
  position:absolute;
  top:2%;
  left:50%;
  transform:translateX(-50%);
  z-index:6;
  pointer-events:none;
  width:min(64vw,320px);
  height:min(46vw,230px);
  opacity:0;
  transition:opacity 1s ease;
}
.sn-couple-art.show{ opacity:1; }

.sn-dove{
  position:absolute;
  opacity:0;
  animation:snDoveFly linear infinite;
}
@keyframes snDoveFly{
  0%{ transform:translate(-15vw,0) scale(.92); opacity:0; }
  8%{ opacity:.85; }
  50%{ transform:translate(50vw,-26px) scale(1); }
  90%{ opacity:.8; }
  100%{ transform:translate(120vw,14px) scale(1.05); opacity:0; }
}

.sn-toss-ring{
  position:absolute;
  animation:snRise linear infinite;
  opacity:0;
}

@media (prefers-reduced-motion: reduce){
  .sn-dove, .sn-toss-ring{ animation:none !important; opacity:.6 !important; }
}

.sn-screen-glow{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:0;
  opacity:0;
  transition:opacity 1.8s ease;
  will-change:opacity;
}
.sn-screen-glow.lit{ opacity:1; }
.sn-screen-glow::before,
.sn-screen-glow::after{
  content:'';
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 0% 0%, rgba(232,207,138,.5), transparent 38%),
    radial-gradient(circle at 100% 0%, rgba(232,207,138,.45), transparent 38%),
    radial-gradient(circle at 0% 100%, rgba(201,162,75,.4), transparent 38%),
    radial-gradient(circle at 100% 100%, rgba(201,162,75,.45), transparent 38%);
  filter:blur(60px);
  animation:snEdgeGlow 6s ease-in-out infinite;
}
.sn-screen-glow::after{
  background:
    linear-gradient(90deg, rgba(255,247,224,.3), transparent 22%, transparent 78%, rgba(255,247,224,.3)),
    linear-gradient(180deg, rgba(255,247,224,.26), transparent 22%, transparent 78%, rgba(255,247,224,.26));
  animation-delay:.7s;
  mix-blend-mode:screen;
}
@keyframes snEdgeGlow{
  0%,100%{ opacity:.65; }
  50%{ opacity:1; }
}
@media (prefers-reduced-motion: reduce){
  .sn-screen-glow::before, .sn-screen-glow::after{ animation:none !important; }
}

.scene-revenge .sn-spark{position:absolute;width:4px;height:4px;background:var(--gold);border-radius:50%;animation:snRise linear infinite;}
.scene-revenge .sn-lightning{position:absolute;animation:snBolt 2.4s ease-in-out infinite;}
.scene-revenge .sn-broken{position:absolute;animation:snShake 1.8s ease-in-out infinite;}
.scene-revenge .sn-drama{position:absolute;animation:snFloat 3s ease-in-out infinite;}

/* PERF: add contain + will-change to lyric lines */
.sn-lyrics-line{
  opacity:.4;
  transform:translateY(10px);
  transition:opacity .45s ease, transform .45s ease, color .35s ease, text-shadow .35s ease;
  animation: snLineIn .55s ease both;
  will-change:opacity, transform;
  contain:layout style;
}

  height:14px;
  animation:none;
}

.sn-lyrics-line.past{
  opacity:.5;
  transform:translateY(0);

  opacity:1;
  color:var(--accent-deep);
  font-weight:600;
  transform:translateY(0) scale(1.05);
  text-shadow:0 0 14px rgba(201,162,75,.4);
  animation: snLinePop .5s ease;
}

.sn-ch{
  display:inline-block;
  opacity:0;
  font-family:'Caveat', cursive;
  font-weight:600;
  animation:snCharStamp .42s cubic-bezier(.25,1.4,.4,1) forwards;
  transition:font-family .5s ease, color .5s ease, font-size .5s ease;
}

@keyframes snCharStamp{
  0%{ opacity:0; transform:scale(1.8) rotate(-10deg) translateY(-6px); filter:blur(1.5px); }
  55%{ opacity:1; transform:scale(.92) rotate(3deg) translateY(1px); filter:blur(0); }
  75%{ transform:scale(1.05) rotate(-1deg); }
  100%{ opacity:1; transform:scale(1) rotate(0deg) translateY(0); }
}

.sn-lyrics-line.active{

/* =========================================================
   STORY ANIMATION PANEL — centered, simple line-art panel
   that tells the Speak Now story scene by scene, floated
   above the lyric modal, dead-center of the screen.
========================================================= */
#snStoryPanel {
  position: fixed;
  inset: 0;
  z-index: 7500;
  pointer-events: none;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: opacity 1.1s ease;
}
#snStoryPanel.visible { opacity: 1 !important; }

.sn-story-frame {
  position: relative;
  width: min(66vw, 440px);
  height: min(50vw, 330px);
  filter: drop-shadow(0 6px 18px rgba(58,20,60,.18));
  background: transparent;
  border: none;
  border-radius: 16px;
}

.sn-story-scene {
  position: absolute;
  inset: 0;
  opacity: 0;
  transform: scale(0.94) translateY(10px);
  transition: opacity 0.85s ease, transform 0.85s cubic-bezier(.34,1.1,.64,1);
  pointer-events: none;
}
.sn-story-scene.active {
  opacity: 1;
  transform: scale(1) translateY(0);
  z-index: 2;
}
.sn-story-scene.exiting {
  opacity: 0;
  transform: scale(1.03) translateY(-6px);
  transition: opacity 0.55s ease, transform 0.55s ease;
  z-index: 1;
}
.sn-story-scene svg{
  filter: saturate(.4) brightness(1.02);
}

@keyframes snTwinkle{
  0%,100%{ opacity:.55; transform:scale(.85); }
  50%{ opacity:1; transform:scale(1.15); }
}
.sn-twinkle{
  transform-box: fill-box;
  transform-origin: center;
  animation: snTwinkle 1.6s ease-in-out infinite;
}

@keyframes snHeartbeat{
  0%,100%{ transform:scale(1); }
  50%{ transform:scale(1.12); }
}
.sn-heartbeat{
  transform-box: fill-box;
  transform-origin: center;
  animation: snHeartbeat 1.8s ease-in-out infinite;
}

@keyframes snSceneBreathe{
  0%,100%{ transform:scale(1) translateY(0); }
  50%{ transform:scale(1.015) translateY(-2px); }
}
.sn-story-scene.active svg{
  transform-origin: center;
  animation: snSceneBreathe 4.5s ease-in-out infinite;
}

@media (prefers-reduced-motion: reduce){
  .sn-twinkle, .sn-heartbeat, .sn-story-scene.active svg{ animation:none !important; }
}

/* Scene label removed per request — captions no longer shown */
#snSceneCaption { display: none; }

@media (max-width: 640px) {

}

/* =========================================================
   CUSTOM CURSOR — Speak Now page
   (its own quill-and-heart cursor + glitter, not the
   friendship-bracelet cursor from the homepage)
========================================================= */
.sn-cursor-pic{
  position:fixed;
  width:46px;
  pointer-events:none;
  transform:translate(-18%,-72%);
  z-index:99999;
  will-change:left,top;
}

.sn-cursor-touch{
  position:fixed;
  width:44px;
  pointer-events:none;
  transform:translate(-18%,-72%);
  z-index:99999;
  display:none;
  will-change:left,top;
}

.sn-glitter{
  position:fixed;
  pointer-events:none;
  z-index:9998;
  animation:snGlitterPop .6s forwards ease-out;
  will-change:transform,opacity;
}
@keyframes snGlitterPop{
  0%{ opacity:1; transform:scale(1.4); }
  100%{
    opacity:0;
    transform:translate(var(--tx),var(--ty)) scale(0) rotate(160deg);
  }
}
.sn-glitter-touch{
  position:fixed;
  pointer-events:none;
  z-index:9998;
  animation:snGlitterPopTouch .75s forwards ease-out;
  will-change:transform,opacity;
}
@keyframes snGlitterPopTouch{
  0%{ opacity:1; transform:scale(1.7); }
  100%{
    opacity:0;
    transform:translate(var(--tx),var(--ty)) scale(0) rotate(200deg);
  }
}

.sn-shimmer{
  position:fixed;
  pointer-events:none;
  z-index:9997;
  animation:snShimmerTwinkle .95s ease-out forwards;
  will-change:transform,opacity,filter;
}
@keyframes snShimmerTwinkle{
  0%{ opacity:0; transform:scale(0) rotate(0deg); filter:brightness(1); }
  22%{ opacity:1; transform:scale(1.35) rotate(70deg); filter:brightness(1.6); }
  55%{ opacity:.9; transform:scale(.85) rotate(150deg) translate(calc(var(--tx) * .4),calc(var(--ty) * .4)); filter:brightness(1.3); }
  100%{
    opacity:0;
    transform:scale(0) rotate(240deg) translate(var(--tx),var(--ty));
    filter:brightness(1);
  }
}
@media (prefers-reduced-motion: reduce){
  .sn-shimmer{ display:none; }
}

  .nav-btn, .sn-tab, .sn-track, .sn-modal-close, .sn-sync-btn, .sn-replay-curtain,

.sn-photo-grid-bg{

  z-index:1;
  display:grid;
  grid-template-columns:repeat(6,1fr);
  grid-template-rows:repeat(4,1fr);

    linear-gradient(180deg, rgba(74,25,66,.04), rgba(74,25,66,.06));
}

/* Frosted "paper" cards behind the actual readable content, so the

#snPageContent{

@media (max-width:768px){

@media (prefers-reduced-motion: reduce){

    '<span class="sn-track-num">' + num + '</span>' +
    '<div class="sn-track-info">' +

var snGridResizeTimers = {};

function renderList(containerId, tracks){
  const el = document.getElementById(containerId);

  function fillGrid(){
    var colMinWidth = 130;
    var gap = 8;
    var containerWidth = window.innerWidth;
    var cols = Math.max(1, Math.floor((containerWidth + gap) / (colMinWidth + gap)));
    var tileHeight = 72;
    // Fill at least one full viewport's worth of rows below where the
    // grid starts, so the tiles read as covering the screen rather than
    // stopping short after a couple of rows.
    var rowsNeeded = Math.max(1, Math.ceil(window.innerHeight / (tileHeight + gap)));
    var totalNeeded = Math.max(tracks.length, cols * rowsNeeded);

    var html = '';
    for(var i = 0; i < totalNeeded; i++){
      var t = tracks[i % tracks.length];
      html += tileHtml(t, (i % tracks.length) + 1);
    }
    el.innerHTML = html;
  }

  fillGrid();

  window.addEventListener('resize', function(){
    clearTimeout(snGridResizeTimers[containerId]);
    snGridResizeTimers[containerId] = setTimeout(fillGrid, 200);
  });
}

}

/* Swipe left/right across the track-list area to move between
   Original / Platinum / Vault tabs on mobile. */
(function(){
  var swipeZone = document.querySelector('.sn-tabs');
  var listZone = document.querySelector('.sn-tabs') && document.querySelector('.sn-tabs').parentElement;
  if(!listZone) return;
  var sx = 0, sy = 0, tracking = false;

  listZone.addEventListener('touchstart', function(e){
    if(e.touches.length !== 1) return;
    sx = e.touches[0].clientX;
    sy = e.touches[0].clientY;
    tracking = true;
  }, {passive:true});

  listZone.addEventListener('touchend', function(e){
    if(!tracking) return;
    tracking = false;
    var dx = e.changedTouches[0].clientX - sx;
    var dy = e.changedTouches[0].clientY - sy;
    if(Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
    var activeTab = document.querySelector('.sn-tab.active');
    if(!activeTab) return;
    var idx = snTabOrder.indexOf(activeTab.dataset.act);
    var nextIdx = dx < 0 ? idx + 1 : idx - 1;
    if(nextIdx < 0 || nextIdx >= snTabOrder.length) return;
    snBuzz(8);
    activateSnTab(snTabOrder[nextIdx]);
  });
})();

/* ---- Real audio-reactive visualizer (falls back to the idle bob above
   if the audio host doesn't serve CORS headers for analysis) ---- */
var snAudioCtx = null, snAnalyser = null, snAudioSrc = null, snVizBars = null, snVizRAF = null;

function initSnAudioAnalyser(){
  if(snAudioCtx) return true;
  try{
    snAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
    snModalAudio.crossOrigin = "anonymous";
    snAudioSrc = snAudioCtx.createMediaElementSource(snModalAudio);
    snAnalyser = snAudioCtx.createAnalyser();
    snAnalyser.fftSize = 64;
    snAudioSrc.connect(snAnalyser);
    snAnalyser.connect(snAudioCtx.destination);
    snVizBars = Array.from(snVizEl.querySelectorAll('.sn-viz-bar'));
    return true;
  } catch(e){
    console.warn('Visualizer: falling back to idle animation (CORS or audio context issue)', e);
    snAudioCtx = null;
    return false;
  }
}

function drawSnVisualizer(){
  snVizRAF = requestAnimationFrame(drawSnVisualizer);
  if(!snAnalyser || snModalAudio.paused) return;
  var data = new Uint8Array(snAnalyser.frequencyBinCount);
  snAnalyser.getByteFrequencyData(data);
  var step = Math.floor(data.length / snVizBars.length) || 1;
  snVizBars.forEach(function(bar, i){
    var v = data[i * step] || 0;
    var pct = Math.max(8, Math.min(95, (v / 255) * 100));
    bar.style.height = pct + '%';
  });
}

snModalAudio.addEventListener('play', function(){
  if(initSnAudioAnalyser()){
    if(snAudioCtx.state === 'suspended') snAudioCtx.resume();
    snVizEl.classList.add('reactive');
    if(!snVizRAF) drawSnVisualizer();
  }
});
snModalAudio.addEventListener('pause', function(){
  snVizEl.classList.remove('reactive');
});

/* ---- Lyric rendering ---- */
function renderLyricsLines(container, lyricsText){
  container.innerHTML = '';
  snLyricLineEls = [];
  snLastActiveIdx = -1;
  var lines = lyricsText.split('\n');
  var visibleCount = 0;
  lines.forEach(function(line){
    var div = document.createElement('div');
    if(line.trim() === ''){
      div.className = 'sn-lyrics-line spacer';
    } else {
      div.className = 'sn-lyrics-line';
      div.textContent = line;
      div.style.animationDelay = Math.min(visibleCount * 0.045, 1.4) + 's';
      snLyricLineEls.push(div);
      visibleCount++;
    }
    container.appendChild(div);
  });
}

function clearActiveLyric(){
  snLyricLineEls.forEach(function(el){ el.classList.remove('active','past','sync-target'); });
  snLastActiveIdx = -1;
}

function typeLine(el){
  var text = el.textContent;
  el.innerHTML = '';
  var chars = Array.from(text);
  chars.forEach(function(ch, i){
    var span = document.createElement('span');
    span.className = 'sn-ch';
    span.textContent = ch === ' ' ? '\u00A0' : ch;
    span.style.animationDelay = (i * 0.026) + 's';
    el.appendChild(span);
  });
  var cursor = document.createElement('span');
  cursor.className = 'sn-cursor';
  cursor.textContent = '▌';
  cursor.style.animationDelay = (chars.length * 0.026) + 's';
  el.appendChild(cursor);
  setTimeout(function(){ if(cursor.parentNode) cursor.remove(); }, chars.length * 26 + 500);
}

/* PERF: throttle timeupdate to ~10fps max */
var snLastUpdateTime = 0;

function updateActiveLyric(){
  if(snSyncMode) return;
  if(snLyricLineEls.length === 0) return;
  var now = performance.now();
  if(now - snLastUpdateTime < 95) return;
  snLastUpdateTime = now;

  var synced = getSyncFor(snCurrentId);
  var idx;
  if(synced && synced.length){
    idx = 0;
    for(var i=0;i<synced.length;i++){
      if(snModalAudio.currentTime >= synced[i].time) idx = synced[i].index;
      else break;
    }
  } else {
    if(!snModalAudio.duration || !isFinite(snModalAudio.duration)) return;
    var progress = Math.min(1, Math.max(0, snModalAudio.currentTime / snModalAudio.duration));
    idx = Math.min(snLyricLineEls.length - 1, Math.floor(progress * snLyricLineEls.length));
  }

  if(idx === snLastActiveIdx) return;
  snLastActiveIdx = idx;

  snLyricLineEls.forEach(function(el, i){
    el.classList.remove('active','past');
    if(i < idx) el.classList.add('past');
  });
  var activeEl = snLyricLineEls[idx];
  typeLine(activeEl);
  activeEl.classList.add('active');
  activeEl.scrollIntoView({ block:'center', behavior:'smooth' });
}

var SN_VOW_TIME = 157.9;
var SN_VOW_HOLD = 6.5;

snModalAudio.addEventListener('timeupdate', updateActiveLyric);
snModalAudio.addEventListener('seeked', function(){ snLastActiveIdx = -1; updateActiveLyric(); });
snModalAudio.addEventListener('play', function(){ snLastActiveIdx = -1; });

snModalAudio.addEventListener('ended', function(){
  var next = getTrackNeighbor(snCurrentId, 1);
  if(next){
    setTimeout(function(){
      loadTrackIntoModal(next, {silent:true});
      snModalAudio.play();
    }, 400);
  }
});

snModalAudio.addEventListener('timeupdate', function(){
  if(snCurrentId !== 'original-3') return;
  var vowEl = document.getElementById('snBgVow');
  var vowTextEl = document.getElementById('snBgVowText');
  if(!vowEl || !vowTextEl) return;
  var inWindow = snModalAudio.currentTime >= SN_VOW_TIME && snModalAudio.currentTime < SN_VOW_TIME + SN_VOW_HOLD;
  if(!snVowTriggered && inWindow){
    snVowTriggered = true;
    stampText(vowTextEl, '"Speak now or forever hold your peace"', 0.045);
    vowEl.classList.add('show');
    burstVowCelebration();
  } else if(snVowTriggered && !inWindow){
    snVowTriggered = false;
    vowEl.classList.remove('show');
    vowTextEl.innerHTML = '';
  }
});

function showVowPreview(){
  var vowEl = document.getElementById('snBgVow');

/* ---- Sync tool ---- */
function resetSyncUI(){
  snSyncMode = false; snSyncTaps = [];
  snSyncStart.style.display = 'inline-block';
  snSyncMarkBtn.style.display = 'none';
  snSyncUndo.style.display = 'none';
  snSyncFinish.style.display = 'none';
  snSyncHint.style.display = 'none';
  snSyncStatus.style.display = 'none';
  snSyncExport.style.display = 'none';
  snSyncClear.style.display = hasSavedSync(snCurrentId) ? 'inline-block' : 'none';
  snLyricLineEls.forEach(function(el){ el.classList.remove('sync-target'); });
}

function markSyncTarget(idx){
  snLyricLineEls.forEach(function(el,i){ el.classList.toggle('sync-target', i===idx); });
  if(idx < snLyricLineEls.length) snLyricLineEls[idx].scrollIntoView({ block:'center', behavior:'smooth' });
}

function loadTrackIntoModal(t, opts){
  opts = opts || {};
  if(!t) return;

  if(!opts.silent) snBuzz(10);
  snModalBackdrop.classList.remove('minimized');
  snMiniPlayer.classList.remove('show');

  snCurrentId = t.id;
  snVowTriggered = false;
  snModalTitle.textContent = t.title;
  snModalFeature.textContent = t.feature || '';
  renderLyricsLines(snModalLyrics, t.lyrics);
  buildScene(t.title);
  requestAnimationFrame(function(){ snSongCanvas.style.opacity = '1'; });

  snModalAudio.src = t.audio;
  snAudioFallback.style.display = 'none';
  snModalAudio.style.display = 'block';
  snModalAudio.load();
  resetSyncUI();
  snModalBackdrop.classList.add('show');
  updateSnPrevNextState();
}

function getTrackNeighbor(id, dir){
  if(!id) return null;
  var sep = id.lastIndexOf('-');
  var act = id.slice(0, sep);
  var idx = parseInt(id.slice(sep + 1), 10);
  var list = snTracks[act];
  if(!list) return null;
  var newIdx = idx + dir;
  if(newIdx < 0 || newIdx >= list.length) return null;
  return list[newIdx];
}

function updateSnPrevNextState(){
  var prevBtn = document.getElementById('snModalPrev');
  var nextBtn = document.getElementById('snModalNext');
  if(!prevBtn || !nextBtn) return;
  prevBtn.disabled = !getTrackNeighbor(snCurrentId, -1);
  nextBtn.disabled = !getTrackNeighbor(snCurrentId, 1);
}

document.addEventListener('click', function(e){

  if(lyricLine && snCurrentId === 'original-3' && lyricLine.textContent.indexOf('forever hold your peace') !== -1){
    showVowPreview(); return;
  }
  var row = e.target.closest('.sn-track');
  if(!row) return;
  var t = allTracksById[row.dataset.id];
  if(!t) return;
  loadTrackIntoModal(t);
});

/* Touch drag on the non-scrolling header/player chrome — swipe down far enough
   to minimize into the mini-player, keeping the audio and scene running. */
(function(){
  var dragEls = [document.querySelector('.sn-modal-header'), document.querySelector('.sn-modal-player')];
  var startY = 0, dragging = false, currentEl = null;

  dragEls.forEach(function(el){
    if(!el) return;
    el.addEventListener('touchstart', function(e){
      if(e.touches.length !== 1) return;
      startY = e.touches[0].clientY;
      dragging = true;
      currentEl = document.querySelector('.sn-modal');
      if(currentEl) currentEl.style.transition = 'none';
    }, {passive:true});

    el.addEventListener('touchmove', function(e){
      if(!dragging || !currentEl) return;
      var dy = e.touches[0].clientY - startY;
      if(dy > 0) currentEl.style.transform = 'translateY(' + Math.min(dy, 200) + 'px)';
    }, {passive:true});

    el.addEventListener('touchend', function(e){
      if(!dragging || !currentEl) return;
      dragging = false;
      var dy = (e.changedTouches[0].clientY - startY);
      currentEl.style.transition = '';
      currentEl.style.transform = '';
      if(dy > 90) minimizeSnModal();
      currentEl = null;
    });
  });
})();
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape' && !snSyncMode) closeSnModal();
  if(snSyncMode && e.code === 'Space'){ e.preventDefault(); markSyncTap(); }
  if(snSyncMode && e.code === 'Enter'){ e.preventDefault(); finishSync(); }
});

snSyncStart.addEventListener('click', function(){
  if(!snCurrentId) return;
  snSyncMode = true; snSyncTaps = [];
  clearActiveLyric();
  snSyncStart.style.display = 'none';
  snSyncMarkBtn.style.display = 'inline-block';
  snSyncUndo.style.display = 'inline-block';
  snSyncFinish.style.display = 'inline-block';
  snSyncClear.style.display = 'none';
  snSyncHint.style.display = 'block';
  snSyncHint.textContent = 'Hit "Mark line" (or press Space) the instant each line starts. Press Enter or "Finish" when done.';
  snSyncStatus.style.display = 'block';
  snSyncStatus.textContent = 'Line 1 of ' + snLyricLineEls.length;
  markSyncTarget(0);
  snModalAudio.currentTime = 0;
  snModalAudio.play();
});

function markSyncTap(){
  if(!snSyncMode) return;
  var idx = snSyncTaps.length;
  if(idx >= snLyricLineEls.length){ finishSync(); return; }
  snSyncTaps.push({ time: Math.round(snModalAudio.currentTime * 100) / 100, index: idx });
  snSyncStatus.textContent = 'Line ' + (idx+2 <= snLyricLineEls.length ? idx+2 : snLyricLineEls.length) + ' of ' + snLyricLineEls.length;
  if(idx + 1 < snLyricLineEls.length){ markSyncTarget(idx + 1); } else { finishSync(); }
}

snSyncMarkBtn.addEventListener('click', markSyncTap);
snSyncUndo.addEventListener('click', function(){
  if(snSyncTaps.length === 0) return;
  snSyncTaps.pop();
  markSyncTarget(snSyncTaps.length);
  snSyncStatus.textContent = 'Line ' + (snSyncTaps.length+1) + ' of ' + snLyricLineEls.length;
});

function finishSync(){
  snSyncMode = false; snModalAudio.pause();
  if(snSyncTaps.length > 0){
    snSyncStore[snCurrentId] = snSyncTaps.slice();
    var label = document.querySelector('[data-synced-label="' + snCurrentId + '"]');
    if(label) label.textContent = 'synced';
    snSyncExport.style.display = 'block';
    snSyncExport.value = 'timedLyrics: ' + JSON.stringify(snSyncTaps) + ',';
    document.getElementById('snSyncCopy').style.display = 'inline-block';
    snSyncStatus.textContent = 'Saved ✓ — copy the box below into that track object to make it permanent.';
  }
  snSyncStart.style.display = 'inline-block';
  snSyncMarkBtn.style.display = 'none';
  snSyncUndo.style.display = 'none';
  snSyncFinish.style.display = 'none';
  snSyncHint.style.display = 'none';
  snSyncClear.style.display = hasSavedSync(snCurrentId) ? 'inline-block' : 'none';
  snLyricLineEls.forEach(function(el){ el.classList.remove('sync-target'); });
}

snSyncFinish.addEventListener('click', finishSync);
snSyncClear.addEventListener('click', function(){
  delete snSyncStore[snCurrentId];
  var label = document.querySelector('[data-synced-label="' + snCurrentId + '"]');
  if(label && !(allTracksById[snCurrentId] && allTracksById[snCurrentId].timedLyrics)) label.textContent = '';
  snSyncExport.style.display = 'none';
  snSyncClear.style.display = 'none';
  document.getElementById('snSyncCopy').style.display = 'none';
});

document.getElementById('snSyncCopy').addEventListener('click', function(){
  navigator.clipboard.writeText(snSyncExport.value).then(function(){
    snShowToast('Copied ✦');
  }).catch(function(){});
});

/* ---- Curtain ---- */
var snCurtainOpened = false;
function openCurtain(){
  if(snCurtainOpened) return;
  snCurtainOpened = true;
  document.body.classList.add('sn-open');
}
var prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
if(prefersReducedMotion){
  document.getElementById('snCurtain').style.display = 'none';
  snCurtainOpened = true;
} else {
  // Don't wait on window 'load' — the remote gstatic image and the
  // mp3tourl.com audio URLs on the page can stall or never resolve,
  // which means 'load' may fire very late (or never), leaving the
  // curtain stuck shut. Open shortly after the DOM is ready instead.
  if(document.readyState === 'complete' || document.readyState === 'interactive'){
    setTimeout(openCurtain, 700);
  } else {
    document.addEventListener('DOMContentLoaded', function(){ setTimeout(openCurtain, 700); });
  }
  // Hard safety net: no matter what else is going on, the curtain
  // should never stay shut forever.
  setTimeout(openCurtain, 2500);
}
document.getElementById('snReplayCurtain').addEventListener('click', function(){
  snBuzz(10);
  var curtain = document.getElementById('snCurtain');
  var halves = curtain.querySelectorAll('.sn-curtain-half');
  // snap shut instantly (no transition) so there's no race with the
  // still-running "open" transition from last time
  halves.forEach(function(h){ h.style.transition = 'none'; });
  document.body.classList.remove('sn-open');
  curtain.style.display = 'flex';
  void curtain.offsetWidth; // force reflow so the instant close registers
  halves.forEach(function(h){ h.style.transition = ''; }); // restore the CSS transition
  void curtain.offsetWidth;
  snCurtainOpened = false;
  setTimeout(openCurtain, 300);
});

/* =========================================================
   CUSTOM CURSOR + GLITTER — Speak Now page
   Same mechanics as the homepage (rAF-driven follower,
   touch follower for mobile, throttled glitter bursts),
   just its own quill-and-heart image and gold/plum glitter
   instead of the homepage's friendship bracelet.
========================================================= */
(function(){
  const follower      = document.getElementById('snFollower');
  const touchFollower = document.getElementById('snTouchFollower');
  const glitterColors  = ['#c9a24b','#e8cf8a','#5a2a8a','#f3d9e4'];

  const isTouchDevice = () => ('ontouchstart' in window) || navigator.maxTouchPoints > 0;

  /* ---- Cursor picker: swap between quill, ring, letter, rose ---- */
  const cursorOptions = document.querySelectorAll('.sn-cursor-option');
  function applyCursor(name){
    const opt = document.querySelector('.sn-cursor-option[data-cursor="' + name + '"]');
    if(!opt) return;
    const src = opt.querySelector('img').getAttribute('src');
    follower.src = src;
    touchFollower.src = src;
    cursorOptions.forEach(o => o.classList.toggle('selected', o === opt));
    try{ localStorage.setItem('snCursorChoice', name); }catch(e){}
  }
  cursorOptions.forEach(function(opt){
    opt.addEventListener('click', function(){ snBuzz(8); applyCursor(opt.dataset.cursor); });
  });
  let savedCursor = 'quill';
  try{ savedCursor = localStorage.getItem('snCursorChoice') || 'quill'; }catch(e){}
  applyCursor(savedCursor);

  const mobileCursorBtn = document.getElementById('snMobileCursorBtn');
  const cursorToolbar = document.getElementById('snCursorToolbar');
  if(mobileCursorBtn){
    mobileCursorBtn.addEventListener('click', function(){
      cursorToolbar.classList.toggle('show');
    });
    document.addEventListener('click', function(e){
      if(window.innerWidth > 768) return;
      if(!cursorToolbar.contains(e.target) && e.target !== mobileCursorBtn){
        cursorToolbar.classList.remove('show');
      }
    });
  }

  let mouseX = -200, mouseY = -200;
  document.addEventListener('mousemove', (e)=>{
    mouseX = e.clientX;
    mouseY = e.clientY;
  });
  function updateFollower(){
    follower.style.left = mouseX + 'px';
    follower.style.top  = mouseY + 'px';
    requestAnimationFrame(updateFollower);
  }
  requestAnimationFrame(updateFollower);

  let touchX = -200, touchY = -200;
  function updateTouchFollower(){
    touchFollower.style.left = touchX + 'px';
    touchFollower.style.top  = touchY + 'px';
    requestAnimationFrame(updateTouchFollower);
  }
  requestAnimationFrame(updateTouchFollower);

  function makeGlitterParticle(x, y, isTouch){
    const g = document.createElement('div');
    g.className = isTouch ? 'sn-glitter-touch' : 'sn-glitter';

    const sizeBase = isTouch ? 9 : 6;
    const spread   = isTouch ? 30 : 22;
    const size     = Math.random() * sizeBase + (isTouch ? 4 : 3);

    g.style.width  = size + 'px';
    g.style.height = size + 'px';
    g.style.left   = (x + (Math.random()-0.5)*spread) + 'px';
    g.style.top    = (y + (Math.random()-0.5)*spread) + 'px';

    const colour = glitterColors[Math.floor(Math.random()*glitterColors.length)];
    g.style.background = colour;
    g.style.clipPath = 'polygon(50% 0%,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0% 50%,39% 39%)';
    g.style.boxShadow = `0 0 6px ${colour}`;

    const flyDist = isTouch ? 46 : 32;
    g.style.setProperty('--tx', (Math.random()-0.5)*flyDist + 'px');
    g.style.setProperty('--ty', (Math.random()-0.5)*flyDist + 'px');

    document.body.appendChild(g);
    setTimeout(()=>g.remove(), isTouch ? 800 : 700);

    // shimmer: an occasional brighter twinkling star layered into the trail
    if(Math.random() < 0.4){ makeShimmerSpark(x, y, isTouch); }
  }

  function makeShimmerSpark(x, y, isTouch){
    const s = document.createElement('div');
    s.className = 'sn-shimmer';

    const spread = isTouch ? 34 : 26;
    const size    = (isTouch ? 7 : 5) + Math.random() * (isTouch ? 6 : 4);

    s.style.width  = size + 'px';
    s.style.height = size + 'px';
    s.style.left   = (x + (Math.random()-0.5)*spread) + 'px';
    s.style.top    = (y + (Math.random()-0.5)*spread) + 'px';

    const colour = Math.random() < 0.5 ? '#e8cf8a' : '#c9a24b';
    s.style.background = colour;
    // four-point sparkle/star shape, distinct from the diamond glitter
    s.style.clipPath = 'polygon(50% 0%,63% 37%,100% 50%,63% 63%,50% 100%,37% 63%,0% 50%,37% 37%)';
    s.style.boxShadow = `0 0 10px ${colour}, 0 0 3px #fff`;

    const flyDist = isTouch ? 40 : 28;
    s.style.setProperty('--tx', (Math.random()-0.5)*flyDist + 'px');
    s.style.setProperty('--ty', (Math.random()-0.5)*flyDist + 'px');

    document.body.appendChild(s);
    setTimeout(()=>s.remove(), 1000);
  }

  let lastMouseGlitter = 0;
  document.addEventListener('mousemove', function(e){
    if(isTouchDevice()) return;
    const now = Date.now();
    if(now - lastMouseGlitter < 90) return;
    lastMouseGlitter = now;
    makeGlitterParticle(e.clientX, e.clientY, false);
  });

  let lastTouchGlitter = 0;
  function spawnTouchGlitter(x, y){
    const now = Date.now();
    if(now - lastTouchGlitter < 160) return;
    lastTouchGlitter = now;
    makeGlitterParticle(x, y, true);
  }

  function handleTouch(e){
    const t = e.touches[0];
    if(!t) return;
    touchX = t.clientX;
    touchY = t.clientY;
    spawnTouchGlitter(t.clientX, t.clientY);
  }
  document.addEventListener('touchstart', handleTouch, {passive:true});
  document.addEventListener('touchmove',  handleTouch, {passive:true});
})();

/* ---- Doodle-style SVG helpers ----

   no cross-hatching or double-strokes — a light, storybook
   line-art feel. filter="url(#snDoodleFilter)" gives just a
   faint hand-drawn wobble. Canvas has generous bleed so
   nothing is clipped, and every figure is a complete closed
   form. */

var SN_DEFS = '<defs>'
  + '<pattern id="snDots" width="9" height="9" patternUnits="userSpaceOnUse">'
  +   '<circle cx="4.5" cy="4.5" r="1.5" fill="#4a2f63"/>'

  + '</pattern>'
  + '<pattern id="snStripes" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(12)">'
  +   '<rect width="4.5" height="9" fill="#4a2f63"/>'
  + '</pattern>'
  + '<pattern id="snStripesGold" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(12)">'
  +   '<rect width="4.5" height="9" fill="#c9a24b"/>'
  + '</pattern>'
  + '<pattern id="snFloral" width="16" height="16" patternUnits="userSpaceOnUse">'
  +   '<circle cx="8" cy="8" r="1.8" fill="none" stroke="#c9788c" stroke-width="1"/>'
  +   '<circle cx="2" cy="2" r="1.1" fill="none" stroke="#c9788c" stroke-width="0.8"/>'
  + '</pattern>'
  + '</defs>';

function mkSVG(content) {
  return '<svg viewBox="-40 -40 460 360" xmlns="http://www.w3.org/2000/svg" '
    + 'style="width:100%;height:100%;background:transparent;" '
    + 'filter="url(#snDoodleFilter)" '
    + 'font-family=\'Caveat,Cormorant Garamond,serif\'>'

    + '</svg>';
}

// Shared doodle helpers — thin ink line, warm plum, with solid hair silhouettes,
// patterned clothing accents, eyebrows and small jewelry for a richer, more
// finished storybook feel (not just bare outlines).
var INK = '#4a2f63';
var LINE = '1.6';
function head(cx, cy, r) {
  return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="#fdf4ec" stroke="'+INK+'" stroke-width="'+LINE+'" stroke-linecap="round"/>';
}
function smile(cx, cy, w) {
  return '<path d="M'+(cx-w/2)+' '+cy+' Q'+cx+' '+(cy+w*.4)+' '+(cx+w/2)+' '+cy+'" fill="none" stroke="'+INK+'" stroke-width="'+LINE+'" stroke-linecap="round"/>';
}
function eye(cx, cy) {
  return '<circle cx="'+cx+'" cy="'+cy+'" r="1.4" fill="'+INK+'"/>'
       + '<circle cx="'+(cx+0.5)+'" cy="'+(cy-0.6)+'" r="0.5" fill="#fff" opacity="0.8"/>';
}
function eyebrow(cx,cy,w,tilt){
  tilt = tilt || 0;
  return '<path d="M'+(cx-w/2)+' '+(cy+tilt)+' Q'+cx+' '+(cy-2.4+tilt)+' '+(cx+w/2)+' '+(cy-tilt*0.4)+'" fill="none" stroke="'+INK+'" stroke-width="1.1" stroke-linecap="round" opacity="0.85"/>';
}
function blush(cx,cy){
  return '<circle cx="'+cx+'" cy="'+cy+'" r="5" fill="#e8a6b8" opacity="0.4"/>';
}
function earring(cx,cy,color){
  color = color || '#c9a24b';
  return '<circle cx="'+cx+'" cy="'+cy+'" r="1.6" fill="none" stroke="'+color+'" stroke-width="1"/>'
       + '<circle cx="'+cx+'" cy="'+(cy+3.4)+'" r="1.5" fill="'+color+'" opacity="0.85"/>';
}
function heart(cx,cy,sz,color) {
  color = color || '#c9788c';
  var s=sz, x=cx, y=cy;
  return '<path class="sn-heartbeat" d="M'+x+' '+(y+s*.3)+' C'+(x-s*.5)+' '+(y-s*.4)+' '+(x-s)+' '+(y+s*.1)+' '+x+' '+(y+s*.7)+' C'+(x+s)+' '+(y+s*.1)+' '+(x+s*.5)+' '+(y-s*.4)+' '+x+' '+(y+s*.3)+'Z" fill="'+color+'" opacity="0.2" stroke="'+color+'" stroke-width="'+LINE+'" stroke-linecap="round" stroke-linejoin="round"/>';
}
function rose(cx,cy,r,color){
  color = color || '#c9788c';
  return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+color+'" opacity="0.18" stroke="'+color+'" stroke-width="1.3"/>'
       + '<circle cx="'+cx+'" cy="'+cy+'" r="'+(r*0.5)+'" fill="none" stroke="'+color+'" stroke-width="1"/>';
}
function sparkleMark(cx,cy,s,color){
  color = color || '#c9a24b';
  return '<path class="sn-twinkle" d="M'+cx+' '+(cy-s)+' L'+cx+' '+(cy+s)+' M'+(cx-s)+' '+cy+' L'+(cx+s)+' '+cy+'" stroke="'+color+'" stroke-width="1.1" stroke-linecap="round" opacity="0.75"/>';
}
// Solid hair silhouette sitting on top of a head circle — cx/cy/r match the head,
// side controls which way the fringe/side-piece sweeps ('l','r','both')
function hair(cx,cy,r,style,side){
  style = style || 'bob';
  side = side || 'both';
  var top = cy - r*0.78;
  var out = '<path d="M'+(cx-r*1.02)+' '+(cy-r*0.05)+' Q'+(cx-r*1.1)+' '+(top-r*0.55)+' '+cx+' '+(top-r*0.6)+' Q'+(cx+r*1.1)+' '+(top-r*0.55)+' '+(cx+r*1.02)+' '+(cy-r*0.05)+' Q'+(cx+r*0.9)+' '+(cy+r*0.15)+' '+(cx+r*0.78)+' '+(cy-r*0.35)+' Q'+cx+' '+(cy-r*0.8)+' '+(cx-r*0.78)+' '+(cy-r*0.35)+' Q'+(cx-r*0.9)+' '+(cy+r*0.15)+' '+(cx-r*1.02)+' '+(cy-r*0.05)+' Z" fill="'+INK+'" stroke="'+INK+'" stroke-width="1"/>';
  if(style==='long' || style==='wavy'){
    var sway = style==='wavy' ? 6 : 3;
    if(side==='l' || side==='both') out += '<path d="M'+(cx-r*1.0)+' '+(cy-r*0.05)+' Q'+(cx-r*1.25-sway)+' '+(cy+r*0.9)+' '+(cx-r*0.65)+' '+(cy+r*1.7)+' Q'+(cx-r*0.9)+' '+(cy+r*0.85)+' '+(cx-r*0.75)+' '+(cy+r*0.1)+' Z" fill="'+INK+'" stroke="'+INK+'" stroke-width="1"/>';
    if(side==='r' || side==='both') out += '<path d="M'+(cx+r*1.0)+' '+(cy-r*0.05)+' Q'+(cx+r*1.25+sway)+' '+(cy+r*0.9)+' '+(cx+r*0.65)+' '+(cy+r*1.7)+' Q'+(cx+r*0.9)+' '+(cy+r*0.85)+' '+(cx+r*0.75)+' '+(cy+r*0.1)+' Z" fill="'+INK+'" stroke="'+INK+'" stroke-width="1"/>';
  }
  return out;
}
// A few soft fold-lines inside a garment path region — cx,cy is roughly the
// garment's center, h is its height; suggests fabric drape without hatching
function folds(cx,cy,h,color){
  color = color || INK;
  return '<path d="M'+(cx-10)+' '+(cy-h*0.15)+' Q'+(cx-6)+' '+cy+' '+(cx-9)+' '+(cy+h*0.32)+'" fill="none" stroke="'+color+'" stroke-width="0.9" opacity="0.4" stroke-linecap="round"/>'
       + '<path d="M'+(cx+9)+' '+(cy-h*0.12)+' Q'+(cx+5)+' '+(cy+h*0.05)+' '+(cx+8)+' '+(cy+h*0.36)+'" fill="none" stroke="'+color+'" stroke-width="0.9" opacity="0.4" stroke-linecap="round"/>';
}
function collar(cx,cy,w,color){
  color = color || INK;
  return '<path d="M'+(cx-w/2)+' '+cy+' L'+cx+' '+(cy+w*0.45)+' L'+(cx+w/2)+' '+cy+'" fill="none" stroke="'+color+'" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>';

========================================================= */

function btrSun(cx,cy,r){
  var rays = '';
  for(var i=0;i<10;i++){
    var a = i * 36 * Math.PI/180;
    var x1 = cx + Math.cos(a)*(r+4), y1 = cy + Math.sin(a)*(r+4);
    var x2 = cx + Math.cos(a)*(r+16), y2 = cy + Math.sin(a)*(r+16);
    rays += '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="#c9a24b" stroke-width="1.3" stroke-linecap="round" opacity="0.7"/>';
  }
  return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="#c9a24b" stroke-width="1.4"/>' + rays;
}
function btrWave(y,amp,color){
  color = color || INK;
  return '<path d="M-40 '+y+' Q0 '+(y-amp)+' 40 '+y+' Q80 '+(y+amp)+' 120 '+y+' Q160 '+(y-amp)+' 200 '+y+' Q240 '+(y+amp)+' 280 '+y+' Q320 '+(y-amp)+' 380 '+y+'" fill="none" stroke="'+color+'" stroke-width="1.1" opacity="0.5"/>';
}
function btrSpotlight(cx,topY,bottomY,width){
  return '<path d="M'+(cx-10)+' '+topY+' L'+(cx-width/2)+' '+bottomY+' L'+(cx+width/2)+' '+bottomY+' L'+(cx+10)+' '+topY+' Z" fill="#e8cf8a" opacity="0.18" stroke="#c9a24b" stroke-width="1"/>';
}
function btrMic(cx,cy){
  return '<rect x="'+(cx-5)+'" y="'+(cy-14)+'" width="10" height="18" rx="5" fill="none" stroke="'+INK+'" stroke-width="1.3"/>'
       + '<line x1="'+cx+'" y1="'+(cy+4)+'" x2="'+cx+'" y2="'+(cy+22)+'" stroke="'+INK+'" stroke-width="1.3" stroke-linecap="round"/>'
       + '<path d="M'+(cx-9)+' '+(cy+2)+' Q'+cx+' '+(cy+14)+' '+(cx+9)+' '+(cy+2)+'" fill="none" stroke="'+INK+'" stroke-width="1.1" opacity="0.7"/>';
}
function btrClap(cx,cy,flip){
  var s = flip ? -1 : 1;
  return '<path d="M'+cx+' '+cy+' Q'+(cx+s*10)+' '+(cy-6)+' '+(cx+s*18)+' '+(cy-2)+' Q'+(cx+s*22)+' '+cy+' '+(cx+s*16)+' '+(cy+6)+' Q'+(cx+s*8)+' '+(cy+8)+' '+cx+' '+cy+' Z" fill="none" stroke="'+INK+'" stroke-width="1.3" stroke-linejoin="round"/>';
}
function btrBalloon(cx,cy,r,color){
  color = color || '#c9788c';
  return '<ellipse cx="'+cx+'" cy="'+cy+'" rx="'+(r*0.8)+'" ry="'+r+'" fill="'+color+'" opacity="0.22" stroke="'+color+'" stroke-width="1.2"/>'
       + '<line x1="'+cx+'" y1="'+(cy+r)+'" x2="'+cx+'" y2="'+(cy+r+22)+'" stroke="'+color+'" stroke-width="0.9" opacity="0.6"/>';
}
function theaterMask(cx,cy,s){
  return '<path d="M'+(cx-s)+' '+(cy-s*0.25)+' Q'+(cx-s)+' '+(cy-s)+' '+cx+' '+(cy-s)+' Q'+(cx+s)+' '+(cy-s)+' '+(cx+s)+' '+(cy-s*0.25)+' Q'+(cx+s)+' '+(cy+s*0.6)+' '+cx+' '+(cy+s*0.8)+' Q'+(cx-s)+' '+(cy+s*0.6)+' '+(cx-s)+' '+(cy-s*0.25)+' Z" fill="#fdf7ee" opacity="0.9" stroke="#5a2a8a" stroke-width="1.1"/>'
       + '<circle cx="'+(cx-s*0.35)+'" cy="'+(cy-s*0.15)+'" r="'+(s*0.14)+'" fill="#5a2a8a"/>'
       + '<circle cx="'+(cx+s*0.35)+'" cy="'+(cy-s*0.15)+'" r="'+(s*0.14)+'" fill="#5a2a8a"/>'
       + '<path d="M'+(cx-s*0.32)+' '+(cy+s*0.3)+' Q'+cx+' '+(cy+s*0.08)+' '+(cx+s*0.32)+' '+(cy+s*0.3)+'" fill="none" stroke="#5a2a8a" stroke-width="1"/>';
}
function btrHandLink(x1,y,x2){
  return '<line x1="'+x1+'" y1="'+y+'" x2="'+x2+'" y2="'+y+'" stroke="#8a8a8a" stroke-width="1.2" opacity="0.55"/>';
}
function haloCrossedOut(cx,cy,r){
  return '<ellipse cx="'+cx+'" cy="'+cy+'" rx="'+r+'" ry="'+(r*0.32)+'" fill="none" stroke="#c9a24b" stroke-width="1.3" opacity="0.85"/>'
       + '<line x1="'+(cx-r*0.85)+'" y1="'+(cy-r*0.45)+'" x2="'+(cx+r*0.85)+'" y2="'+(cy+r*0.45)+'" stroke="#c0392b" stroke-width="1.5" stroke-linecap="round"/>'
       + '<line x1="'+(cx-r*0.85)+'" y1="'+(cy+r*0.45)+'" x2="'+(cx+r*0.85)+'" y2="'+(cy-r*0.45)+'" stroke="#c0392b" stroke-width="1.5" stroke-linecap="round"/>';
}
function btrScissors(cx,cy,rot){
  rot = rot || 0;
  return '<g transform="rotate('+rot+' '+cx+' '+cy+')">'
       + '<circle cx="'+(cx-4)+'" cy="'+(cy+14)+'" r="4.5" fill="none" stroke="'+INK+'" stroke-width="1.2"/>'
       + '<circle cx="'+(cx+4)+'" cy="'+(cy+14)+'" r="4.5" fill="none" stroke="'+INK+'" stroke-width="1.2"/>'
       + '<line x1="'+(cx-3.5)+'" y1="'+(cy+10)+'" x2="'+cx+'" y2="'+(cy-16)+'" stroke="'+INK+'" stroke-width="1.3" stroke-linecap="round"/>'
       + '<line x1="'+(cx+3.5)+'" y1="'+(cy+10)+'" x2="'+cx+'" y2="'+(cy-16)+'" stroke="'+INK+'" stroke-width="1.3" stroke-linecap="round"/>'
       + '</g>';
}

function hnCrescentMoon(cx,cy,r){
  return '<path d="M'+(cx+r*0.35)+' '+(cy-r)+' A'+r+' '+r+' 0 1 0 '+(cx+r*0.35)+' '+(cy+r)+' A'+(r*0.72)+' '+(r*0.72)+' 0 1 1 '+(cx+r*0.35)+' '+(cy-r)+' Z" fill="#e8cf8a" opacity="0.85" stroke="#c9a24b" stroke-width="1"/>';
}
function hnStars(pts,color){
  color = color || '#c9a24b';
  return pts.map(function(p){
    return '<path class="sn-twinkle" d="M'+p[0]+' '+(p[1]-3)+' L'+p[0]+' '+(p[1]+3)+' M'+(p[0]-3)+' '+p[1]+' L'+(p[0]+3)+' '+p[1]+'" stroke="'+color+'" stroke-width="1" stroke-linecap="round" opacity="0.7"/>';
  }).join('');
}
function hnMist(cx,cy,w,color){
  color = color || '#b9a8d6';
  var h = w*0.28;

       + '<ellipse cx="'+(cx-w*0.35)+'" cy="'+(cy-h*0.4)+'" rx="'+(w*0.55)+'" ry="'+(h*0.7)+'" fill="'+color+'" opacity="0.13"/>';
}

function hnLocket(cx,cy,r){
  r = r || 46;
  var chainTopY = cy - r*1.5;
  return '<path d="M'+cx+' '+chainTopY+' Q'+(cx-r*0.5)+' '+(cy-r*0.9)+' '+cx+' '+(cy-r*0.7)+' Q'+(cx+r*0.5)+' '+(cy-r*0.9)+' '+cx+' '+chainTopY+'" fill="none" stroke="#c9a24b" stroke-width="1.1" opacity="0.7"/>'

    + '<circle cx="'+cx+'" cy="'+(cy-r*1.02)+'" r="'+(r*0.1)+'" fill="none" stroke="#c9a24b" stroke-width="1"/>';
}
function hnLocketPortrait(cx,cy,r){
  r = r || 46;
  var hy = cy - r*0.05, hr = r*0.32;

    + hair(cx-hr*0.95,hy,hr,'wavy','l')

var HN_INK = INK;
function hnSingMouth(cx,cy,w,h){
  h = h || 8;
  return '<ellipse class="hn-sing-mouth" cx="'+cx+'" cy="'+cy+'" rx="'+(w/2)+'" ry="'+h+'" fill="'+HN_INK+'" opacity="0.85" style="transform-box:fill-box;transform-origin:center;"/>';
}
function hnElectricGuitar(cx,cy,rot){
  rot = rot || 0;
  return '<g transform="rotate('+rot+' '+cx+' '+cy+')">'
    + '<path d="M'+(cx-15)+' '+(cy+8)+' L'+(cx-3)+' '+(cy-8)+' L'+(cx+8)+' '+(cy)+' L'+(cx+18)+' '+(cy-6)+' L'+(cx+22)+' '+(cy+18)+' L'+(cx+6)+' '+(cy+32)+' L'+(cx-9)+' '+(cy+36)+' L'+(cx-19)+' '+(cy+22)+' Z" fill="#fdf7ee" opacity="0.9" stroke="'+HN_INK+'" stroke-width="1.3" stroke-linejoin="round"/>'
    + '<circle cx="'+(cx-2)+'" cy="'+(cy+18)+'" r="4" fill="none" stroke="'+HN_INK+'" stroke-width="1"/>'
    + '<rect x="'+(cx-3)+'" y="'+(cy-48)+'" width="6" height="42" fill="none" stroke="'+HN_INK+'" stroke-width="1.2"/>'
    + '<path d="M'+(cx-9)+' '+(cy-48)+' L'+(cx+9)+' '+(cy-55)+' L'+(cx+5)+' '+(cy-41)+' Z" fill="none" stroke="'+HN_INK+'" stroke-width="1.2" stroke-linejoin="round"/>'
    + '<line x1="'+(cx-1.5)+'" y1="'+(cy-4)+'" x2="'+(cx-1.5)+'" y2="'+(cy+28)+'" stroke="'+HN_INK+'" stroke-width="0.6" opacity="0.6"/>'
    + '<line x1="'+(cx+1.5)+'" y1="'+(cy-4)+'" x2="'+(cx+1.5)+'" y2="'+(cy+28)+'" stroke="'+HN_INK+'" stroke-width="0.6" opacity="0.6"/>'
    + '</g>';
}
function hnLightningBurst(cx,cy,s){
  s = s || 12;
  return '<path d="M'+cx+' '+(cy-s)+' L'+(cx-s*0.5)+' '+(cy+s*0.15)+' L'+cx+' '+(cy+s*0.15)+' L'+(cx-s*0.35)+' '+(cy+s)+'" fill="none" stroke="#c9a24b" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>';
}
function hnMemoryFrame(cx,cy,r){
  return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="#fdf7ee" opacity="0.4"/>'
       + '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+HN_INK+'" stroke-width="0.9" stroke-dasharray="3 5" opacity="0.5"/>';
}
function hnMiniBody(cx,headCy,r){
  var topY = headCy + r*0.75;
  var h = r*3.1, w = r*1.9;
  var botY = topY + h;
  return '<path d="M'+(cx-w*0.42)+' '+topY+' Q'+(cx-w*0.6)+' '+(topY+h*0.55)+' '+(cx-w*0.48)+' '+botY+' Q'+cx+' '+(botY+h*0.1)+' '+(cx+w*0.48)+' '+botY+' Q'+(cx+w*0.6)+' '+(topY+h*0.55)+' '+(cx+w*0.42)+' '+topY+' Z" fill="none" stroke="'+HN_INK+'" stroke-width="1.05" stroke-linecap="round" stroke-linejoin="round"/>';
}

/* Pre-render all scenes once on first open so transitions are instant */
var snSceneCache = {};
var snSceneEls = {};

function preRenderStoryScenes() {
  ALL_STORY_BEATS.forEach(function(beat) {
    var id = beat[1];
    if(snSceneCache[id]) return;
    var el = document.createElement('div');
    el.className = 'sn-story-scene';
    el.setAttribute('data-scene', id);
    var builder = SN_SCENE_BUILDERS[id];
    if(builder) el.innerHTML = builder();
    snStoryFrame.appendChild(el);
    snSceneEls[id] = el;
    snSceneCache[id] = true;
  });
}

var snActiveSceneId = null;

function showStoryScene(id) {
  if(snActiveSceneId === id) return;
  if(snActiveSceneId && snSceneEls[snActiveSceneId]) {
    var old = snSceneEls[snActiveSceneId];
    old.classList.remove('active');
    old.classList.add('exiting');
    setTimeout(function(){ if(old) old.classList.remove('exiting'); }, 700);
  }
  snActiveSceneId = id;
  if(snSceneEls[id]) {
    snSceneEls[id].classList.add('active');
  }
}

var CURRENT_STORY_BEATS = SN_STORY_BEATS;

function updateStoryScene(currentTime) {
  if(!SN_STORY_ACTIVE) return;
  var beats = CURRENT_STORY_BEATS;
  var beat = beats[0];
  for(var i = 0; i < beats.length; i++) {
    if(currentTime >= beats[i][0]) beat = beats[i];
    else break;
  }
  showStoryScene(beat[1]);
}

function startStoryAnimation(beats) {
  CURRENT_STORY_BEATS = beats || SN_STORY_BEATS;
  SN_STORY_ACTIVE = true;
  snStoryPanel.classList.add('visible');
  preRenderStoryScenes();
  updateStoryScene(snModalAudio.currentTime || 0);
}

function stopStoryAnimation() {
  SN_STORY_ACTIVE = false;
  snStoryPanel.classList.remove('visible');
  if(snActiveSceneId && snSceneEls[snActiveSceneId]) {
    snSceneEls[snActiveSceneId].classList.remove('active');
  }
  snActiveSceneId = null;
}

/* Hook into existing timeupdate — story runs for Speak Now (original-3),
   Better Than Revenge (original-9), Haunted (original-11), and
   The Story of Us (original-6) */
snModalAudio.addEventListener('timeupdate', function() {
  if(snCurrentId !== 'original-3' && snCurrentId !== 'original-9' && snCurrentId !== 'original-11' && snCurrentId !== 'original-6' && snCurrentId !== 'original-10') return;
  updateStoryScene(snModalAudio.currentTime);
});

/* Extend buildScene to also start/stop the story panel */
var _origBuildScene = buildScene;
buildScene = function(title) {
  _origBuildScene(title);
  if(title === 'Speak Now') {
    setTimeout(function(){ startStoryAnimation(SN_STORY_BEATS); }, 400);
  } else if(title === 'Better Than Revenge') {
    setTimeout(function(){ startStoryAnimation(BTR_STORY_BEATS); }, 400);
  } else if(title === 'Haunted') {
    setTimeout(function(){ startStoryAnimation(HAUNTED_STORY_BEATS); }, 400);
  } else if(title === 'The Story of Us') {
    setTimeout(function(){ startStoryAnimation(STORY_OF_US_STORY_BEATS); }, 400);
  } else if(title === 'Innocent') {
    setTimeout(function(){ startStoryAnimation(INNOCENT_STORY_BEATS); }, 400);
  } else {
    stopStoryAnimation();
  }
};
