<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2a1c12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="evermore">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%233d2b1e'/%3E%3Cpath d='M32 10 Q20 22 20 34 Q20 46 32 54 Q44 46 44 34 Q44 22 32 10 Z' fill='none' stroke='%23c9a876' stroke-width='2.4'/%3E%3Cpath d='M32 20 L32 48 M32 30 L26 24 M32 30 L38 24 M32 40 L25 35 M32 40 L39 35' stroke='%23c9a876' stroke-width='1.6' stroke-linecap='round'/%3E%3C/svg%3E">
<title>evermore · Lookbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,500;1,500&family=EB+Garamond:ital@0;1&family=Caveat:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6efe2;
  --curtain:#3d2b1e;
  --curtain-dark:#2a1c12;
  --curtain-shadow:#1a1009;
  --accent:#6b4226;
  --accent-deep:#4a2c17;
  --gold:#8a6d3b;
  --gold-light:#c9a876;
  --text:#2e2418;
  --sage:#5c6b4f;
  --rust:#a8563c;
  --paper:#fdf8ef;
}

*{margin:0;padding:0;box-sizing:border-box}

body{
  background:var(--bg);
  font-family:'Playfair Display',serif;
  color:var(--text);
  overflow-x:hidden;
  cursor:none;
}

::selection{ background:var(--gold-light); color:var(--curtain-dark); }

.em-curtain{
  position:fixed;
  inset:0;
  z-index:5000;
  display:flex;
  pointer-events:none;
}
.em-curtain-half{
  width:50%;
  height:100%;
  background:
    repeating-linear-gradient(90deg, rgba(0,0,0,0) 0px, rgba(0,0,0,.16) 18px, rgba(0,0,0,0) 36px),
    linear-gradient(180deg, var(--curtain) 0%, var(--curtain-dark) 70%, var(--curtain-shadow) 100%);
  box-shadow: inset 0 0 120px rgba(0,0,0,.55);
  transition: transform 1.4s cubic-bezier(.77,0,.18,1);
  position:relative;
}
.em-curtain-half::after{
  content:'';
  position:absolute;
  top:0; bottom:0;
  width:40px;
  background:linear-gradient(90deg, rgba(255,255,255,.1), transparent);
}
.em-curtain-left::after{ right:0; }
.em-curtain-right::after{ left:0; transform:scaleX(-1); }

.em-curtain-valance{
  position:absolute;
  top:0; left:0; right:0;
  height:70px;
  background:var(--curtain-dark);
  clip-path:polygon(0% 0%,100% 0%,100% 40%,92% 100%,84% 40%,76% 100%,68% 40%,60% 100%,52% 40%,44% 100%,36% 40%,28% 100%,20% 40%,12% 100%,4% 40%,0% 100%);
  z-index:2;
}
.em-curtain-label{
  position:absolute;
  top:50%; left:50%;
  transform:translate(-50%,-50%);
  color:var(--gold-light);
  font-family:'Caveat',cursive;
  font-weight:600;
  font-size:52px;
  letter-spacing:1px;
  text-align:center;
  z-index:3;
  text-shadow:0 2px 12px rgba(0,0,0,.5);
}
body.em-open .em-curtain-left{ transform:translateX(-100%); }
body.em-open .em-curtain-right{ transform:translateX(100%); }
body.em-open .em-curtain{ pointer-events:none; }

.em-replay-curtain{
  position:fixed;
  bottom:max(18px, env(safe-area-inset-bottom) + 10px);
  left:max(18px, env(safe-area-inset-left) + 10px);
  z-index:900;
  background:var(--curtain-dark);
  color:var(--gold-light);
  border:1px solid var(--gold);
  border-radius:20px;
  padding:8px 16px;
  font-family:'Cormorant Garamond',serif;
  font-size:14px;
  letter-spacing:.5px;
  cursor:none;
  opacity:.85;
}
.em-replay-curtain:hover{ opacity:1; }

.era-nav, .bottom-nav{ display:flex; justify-content:center; padding:22px 30px; }
.nav-btn{
  padding:9px 22px;
  border-radius:24px;
  border:1.5px solid var(--accent);
  text-decoration:none;
  color:var(--accent);
  font-weight:700;
  font-size:15px;
  letter-spacing:.5px;
  transition:.25s;
  cursor:none;
}
.nav-btn:hover{ background:var(--accent); color:#fff; }

.em-program{ max-width:1400px; margin:0 auto 60px; padding:10px 24px 80px; }
.em-program-title{ text-align:center; font-size:30px; color:var(--accent-deep); margin-bottom:6px; }
.em-program-sub{ text-align:center; font-family:'Cormorant Garamond',serif; font-style:italic; color:var(--accent); margin-bottom:30px; }

.em-act-heading{
  font-family:'Cormorant Garamond',serif;
  font-style:italic;
  font-size:19px;
  color:var(--accent);
  text-align:center;
  margin-bottom:18px;
  padding-bottom:10px;
  border-bottom:1px solid var(--gold-light);
}

.em-track-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(220px, 1fr));
  gap:14px;
  width:100%;
  background-color:#241a11;
  padding:14px;
  border-radius:20px;
}
.em-track{
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; gap:8px; padding:34px 20px; min-height:130px;
  cursor:none; transition:.25s; position:relative; z-index:1;
  border-radius:16px; box-shadow:0 10px 26px rgba(26,16,9,.32);
  border:2px solid #241a11; margin:0;
}
.em-track:nth-child(6n+1){ background-color:#4a2c17 !important; }
.em-track:nth-child(6n+2){ background-color:#6b4226 !important; }
.em-track:nth-child(6n+3){ background-color:#3d2b1e !important; }
.em-track:nth-child(6n+4){ background-color:#5c6b4f !important; }
.em-track:nth-child(6n+5){ background-color:#4f3a28 !important; }
.em-track:nth-child(6n+6){ background-color:#7a4a35 !important; }
.em-track:nth-child(6n+1):hover{ background-color:#6b4226 !important; }
.em-track:nth-child(6n+2):hover{ background-color:#8a5730 !important; }
.em-track:nth-child(6n+3):hover{ background-color:#503923 !important; }
.em-track:nth-child(6n+4):hover{ background-color:#71835e !important; }
.em-track:nth-child(6n+5):hover{ background-color:#634728 !important; }
.em-track:nth-child(6n+6):hover{ background-color:#8f5b42 !important; }
.em-track:hover{ border-color:var(--gold); transform:translateY(-2px); box-shadow:0 14px 32px rgba(26,16,9,.4); }

.em-track-num{ font-family:'Cormorant Garamond',serif; color:var(--gold-light); font-size:18px; }
.em-track-info{ min-width:0; }
.em-track-title{ font-size:17px; color:var(--paper); line-height:1.25; }
.em-track-feature{ font-family:'Cormorant Garamond',serif; font-style:italic; font-size:13px; color:var(--gold-light); }
.em-track-note{ font-size:16px; color:var(--gold-light); }
.em-track-synced{ font-size:11px; color:var(--accent); font-family:'Cormorant Garamond',serif; font-style:italic; }

.em-modal-backdrop{
  position:fixed; inset:0; background:rgba(26,16,9,.6);
  backdrop-filter:blur(2px); z-index:6000; display:none;
  align-items:center; justify-content:center; padding:24px;
}
.em-modal-backdrop.show{ display:flex; }
.em-modal{
  position:relative; z-index:1;
  background:rgba(253,248,239,.9);
  backdrop-filter:blur(10px) saturate(1.15);
  -webkit-backdrop-filter:blur(10px) saturate(1.15);
  max-width:520px; width:100%; max-height:85vh;
  border-radius:14px; box-shadow:0 30px 70px rgba(0,0,0,.4);
  display:flex; flex-direction:column; overflow:hidden;
  border:1px solid var(--gold-light);
}
.em-modal-header{
  padding:22px 26px 14px; border-bottom:1px solid var(--gold-light);
  position:sticky; top:0; z-index:3;
  background:rgba(253,248,239,.92);
  overflow:hidden; flex-shrink:0;
}
.em-modal-particles{ position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:0; }
.em-particle{ position:absolute; bottom:-10px; color:var(--gold); opacity:0; animation:emParticleFloat linear forwards; }
@keyframes emParticleFloat{
  0%{ opacity:0; transform:translateY(0) rotate(0deg); }
  12%{ opacity:.85; } 85%{ opacity:.5; }
  100%{ opacity:0; transform:translateY(-160px) rotate(50deg); }
}
@media (prefers-reduced-motion: reduce){ .em-particle{ display:none; } }

.em-drag-handle{
  display:none; position:absolute; top:8px; left:50%; transform:translateX(-50%);
  width:38px; height:4px; border-radius:3px; background:var(--gold); opacity:.55; z-index:4;
}
@media (max-width:768px){ .em-drag-handle{ display:block; } }
.em-modal-backdrop.minimized{ opacity:0; pointer-events:none; }

.em-mini-player{
  position:fixed; left:12px; right:12px;
  bottom:max(12px, env(safe-area-inset-bottom) + 8px);
  z-index:6500; display:none; align-items:center; gap:12px;
  background:rgba(253,248,239,.96); border:1px solid var(--gold-light);
  border-radius:16px; box-shadow:0 12px 30px rgba(26,16,9,.3);
  padding:10px 12px; backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  cursor:pointer; touch-action:manipulation;
}
.em-mini-player.show{ display:flex; }
.em-mini-play{
  flex-shrink:0; width:38px; height:38px; border-radius:50%;
  border:1.5px solid var(--accent); background:var(--paper); color:var(--accent);
  font-size:14px; display:flex; align-items:center; justify-content:center; cursor:pointer;
}
.em-mini-info{ flex:1; min-width:0; }
.em-mini-title{
  font-family:'Cormorant Garamond',serif; font-weight:600; font-size:15px;
  color:var(--accent-deep); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.em-mini-hint{ font-family:'Cormorant Garamond',serif; font-style:italic; font-size:11px; color:var(--accent); opacity:.7; }
.em-mini-close{ flex-shrink:0; border:none; background:none; color:var(--accent); font-size:16px; opacity:.7; cursor:pointer; padding:6px; }
.em-mini-close:hover{ opacity:1; }

.em-toast{
  position:fixed; left:50%; bottom:max(90px, env(safe-area-inset-bottom) + 80px);
  transform:translateX(-50%) translateY(12px);
  background:var(--accent-deep); color:var(--paper);
  font-family:'Cormorant Garamond',serif; font-size:14px; padding:9px 18px; border-radius:20px;
  opacity:0; pointer-events:none; transition:opacity .25s ease, transform .25s ease; z-index:7000;
}
.em-toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

.em-modal-share{
  position:absolute; top:16px; right:52px; background:none; border:none;
  font-size:19px; color:var(--accent); cursor:pointer; touch-action:manipulation; line-height:1; z-index:5; opacity:.85;
}
.em-modal-share:hover{ opacity:1; }
.em-modal-close{
  position:absolute; top:16px; right:18px; background:none; border:none;
  font-size:22px; color:var(--accent); cursor:none; line-height:1; z-index:5;
}
.em-modal-title{ font-size:26px; color:var(--accent-deep); padding-right:66px; position:relative; z-index:2; pointer-events:none; }
.em-modal-feature{ font-family:'Cormorant Garamond',serif; font-style:italic; color:var(--accent); font-size:15px; margin-top:4px; position:relative; z-index:2; pointer-events:none; }

.em-modal-body-wrap{ position:relative; flex:1; min-height:0; overflow:hidden; display:flex; }
.em-modal-body{
  position:relative; z-index:1; padding:20px 26px; overflow-y:auto; overscroll-behavior:contain;
  font-family:'EB Garamond',serif; font-size:17px; line-height:1.9; color:var(--text); flex:1; scroll-behavior:smooth;
}

.em-lyrics-line{
  opacity:.4; transform:translateY(10px);
  transition:opacity .45s ease, transform .45s ease, color .35s ease, text-shadow .35s ease;
  animation: emLineIn .55s ease both; will-change:opacity, transform; contain:layout style;
}
.em-lyrics-line.spacer{ height:14px; animation:none; }
.em-lyrics-line.past{ opacity:.5; transform:translateY(0); }
.em-lyrics-line.active{
  opacity:1; color:var(--accent-deep); font-weight:600; transform:translateY(0) scale(1.05);
  text-shadow:0 0 14px rgba(138,109,59,.4); animation: emLinePop .5s ease; font-size:22px;
}
.em-lyrics-line.sync-target{ outline:2px dashed var(--gold); outline-offset:4px; border-radius:4px; }

.em-ch{
  display:inline-block; opacity:0; font-family:'Caveat', cursive; font-weight:600;
  animation:emCharStamp .42s cubic-bezier(.25,1.4,.4,1) forwards;
  transition:font-family .5s ease, color .5s ease, font-size .5s ease;
}
@keyframes emCharStamp{
  0%{ opacity:0; transform:scale(1.8) rotate(-10deg) translateY(-6px); filter:blur(1.5px); }
  55%{ opacity:1; transform:scale(.92) rotate(3deg) translateY(1px); filter:blur(0); }
  75%{ transform:scale(1.05) rotate(-1deg); }
  100%{ opacity:1; transform:scale(1) rotate(0deg) translateY(0); }
}
.em-lyrics-line.past .em-ch{ font-family:'EB Garamond', serif; font-weight:400; font-size:17px; }
.em-cursor-blink{ display:inline-block; margin-left:2px; font-family:'Caveat', cursive; color:var(--gold); animation:emCursorBlink .8s steps(2) infinite; }
@keyframes emCursorBlink{ 0%,100%{ opacity:1; } 50%{ opacity:0; } }
@media (prefers-reduced-motion: reduce){ .em-ch{ animation:none !important; opacity:1 !important; font-family:'EB Garamond', serif !important; } }
@keyframes emLineIn{ from{ opacity:0; transform:translateY(16px); } to{ opacity:.4; transform:translateY(0); } }
@keyframes emLinePop{ 0%{ transform:translateY(0) scale(.96); } 55%{ transform:translateY(0) scale(1.08); } 100%{ transform:translateY(0) scale(1.05); } }
@media (prefers-reduced-motion: reduce){ .em-lyrics-line{ animation:none !important; transition:none !important; } }

.em-modal-player{ padding:16px 26px 22px; border-top:1px solid var(--gold-light); background:rgba(253,248,239,.92); position:relative; }
.em-modal-visualizer{ display:flex; align-items:flex-end; justify-content:center; gap:4px; height:46px; margin-bottom:12px; padding:0 4px; }
.em-viz-bar{
  width:5px; height:14%; min-height:4px; border-radius:3px;
  background:linear-gradient(180deg, var(--gold-light), var(--accent));
  transform-origin:bottom; animation:emIdleBob 1.6s ease-in-out infinite;
}
@keyframes emIdleBob{ 0%,100%{ height:10%; opacity:.55; } 50%{ height:32%; opacity:.85; } }
.em-modal-visualizer.reactive .em-viz-bar{ animation:none; transition:height .07s linear; opacity:.95; }
@media (prefers-reduced-motion: reduce){ .em-viz-bar{ animation:none !important; height:20% !important; } }

.em-track-nav-btn{
  position:fixed; top:50%; transform:translateY(-50%);
  display:flex; flex-direction:column; align-items:center; gap:4px;
  background:none; border:none; padding:14px 10px; color:var(--accent);
  font-family:'Cormorant Garamond',serif; font-weight:600; font-style:italic; font-size:40px; line-height:1;
  cursor:pointer; touch-action:manipulation; z-index:6600; opacity:.8;
  text-shadow:0 1px 4px rgba(26,16,9,.2); transition:transform .25s ease, opacity .25s ease;
}
.em-track-nav-btn::before, .em-track-nav-btn::after{ content:'🍂'; font-size:10px; color:var(--accent); opacity:.55; }
.em-track-nav-prev{ left:max(10px, env(safe-area-inset-left) + 2px); }
.em-track-nav-next{ right:max(10px, env(safe-area-inset-right) + 2px); }
.em-track-nav-btn:hover{ transform:translateY(-50%) scale(1.1); opacity:1; }
.em-track-nav-btn:disabled{ opacity:.28; cursor:default; pointer-events:none; text-shadow:none; }
.em-track-nav-btn{ display:none; }
.em-modal-backdrop.show .em-track-nav-btn{ display:flex; }
.em-modal-backdrop.show.minimized .em-track-nav-btn{ display:none; }
@media (max-width:420px){
  .em-track-nav-btn{ font-size:32px; padding:10px 6px; }
  .em-track-nav-prev{ left:max(4px, env(safe-area-inset-left)); }
  .em-track-nav-next{ right:max(4px, env(safe-area-inset-right)); }
}
.em-modal-player audio{ width:100%; }
.em-audio-fallback{ font-family:'Cormorant Garamond',serif; font-style:italic; font-size:14px; color:var(--accent); text-align:center; display:none; }

.em-sync-row{ display:flex; align-items:center; gap:10px; margin-top:12px; flex-wrap:wrap; }
.em-sync-btn{
  font-family:'Cormorant Garamond',serif; font-size:14px; background:none;
  border:1px solid var(--accent); color:var(--accent); border-radius:16px; padding:6px 16px;
  cursor:none; transition:.2s;
}
.em-sync-btn:hover{ background:var(--accent); color:#fff; }
.em-sync-btn.primary{ background:var(--accent); color:#fff; }
.em-sync-btn.primary:hover{ background:var(--accent-deep); }
.em-sync-hint{ font-family:'Cormorant Garamond',serif; font-style:italic; font-size:13px; color:var(--accent); width:100%; }
.em-sync-status{ font-family:'Cormorant Garamond',serif; font-style:italic; font-size:13px; color:var(--gold); width:100%; }
.em-sync-export{
  width:100%; margin-top:8px; font-family:monospace; font-size:11px; color:var(--text);
  background:var(--bg); border:1px solid var(--gold-light); border-radius:8px; padding:8px;
  max-height:100px; overflow-y:auto; white-space:pre-wrap; word-break:break-all; display:none;
}

/* ---- custom cursor + glitter ---- */
.em-cursor-pic{ position:fixed; width:44px; pointer-events:none; transform:translate(-18%,-72%); z-index:99999; will-change:left,top; }
.em-cursor-touch{ position:fixed; width:42px; pointer-events:none; transform:translate(-18%,-72%); z-index:99999; display:none; will-change:left,top; }
.em-glitter{ position:fixed; pointer-events:none; z-index:9998; animation:emGlitterPop .6s forwards ease-out; will-change:transform,opacity; }
@keyframes emGlitterPop{ 0%{ opacity:1; transform:scale(1.4); } 100%{ opacity:0; transform:translate(var(--tx),var(--ty)) scale(0) rotate(160deg); } }
.em-glitter-touch{ position:fixed; pointer-events:none; z-index:9998; animation:emGlitterPopTouch .75s forwards ease-out; will-change:transform,opacity; }
@keyframes emGlitterPopTouch{ 0%{ opacity:1; transform:scale(1.7); } 100%{ opacity:0; transform:translate(var(--tx),var(--ty)) scale(0) rotate(200deg); } }
.em-shimmer{ position:fixed; pointer-events:none; z-index:9997; animation:emShimmerTwinkle .95s ease-out forwards; will-change:transform,opacity,filter; }
@keyframes emShimmerTwinkle{
  0%{ opacity:0; transform:scale(0) rotate(0deg); filter:brightness(1); }
  22%{ opacity:1; transform:scale(1.35) rotate(70deg); filter:brightness(1.6); }
  55%{ opacity:.9; transform:scale(.85) rotate(150deg) translate(calc(var(--tx) * .4),calc(var(--ty) * .4)); filter:brightness(1.3); }
  100%{ opacity:0; transform:scale(0) rotate(240deg) translate(var(--tx),var(--ty)); filter:brightness(1); }
}
@media (prefers-reduced-motion: reduce){ .em-shimmer{ display:none; } }
@media (max-width:768px){
  .em-cursor-pic{ display:none !important; }
  .em-cursor-touch{ display:block; }
  body{ cursor:auto; }
  .nav-btn, .em-track, .em-modal-close, .em-sync-btn, .em-replay-curtain{ cursor:pointer; }
  .nav-btn, .em-track, .em-modal-close, .em-sync-btn, .em-replay-curtain,
  .em-cursor-option, #emMobileCursorBtn, .em-mini-player{ touch-action:manipulation; }
}

.em-cursor-toolbar{
  position:fixed; top:max(20px, env(safe-area-inset-top) + 12px); right:max(25px, env(safe-area-inset-right) + 15px);
  z-index:9500; display:flex; align-items:center; gap:8px;
  background:#fbf2e2; padding:8px 12px; border-radius:25px; border:2px dashed var(--accent);
}
.em-cursor-toolbar-title{ font-family:'Cormorant Garamond',serif; font-style:italic; font-size:12px; color:var(--accent); font-weight:600; margin-right:2px; white-space:nowrap; }
.em-cursor-option{
  width:34px; height:34px; border-radius:50%; border:2px solid transparent; background:var(--paper);
  display:flex; align-items:center; justify-content:center; cursor:pointer; transition:.2s; padding:5px;
}
.em-cursor-option img{ width:100%; height:100%; pointer-events:none; }
.em-cursor-option:hover{ transform:scale(1.15); }
.em-cursor-option.selected{ border-color:var(--accent); box-shadow:0 0 8px var(--gold); }

#emMobileCursorBtn{
  display:none; position:fixed; top:max(15px, env(safe-area-inset-top) + 8px); right:max(15px, env(safe-area-inset-right) + 8px);
  width:46px; height:46px; border:none; border-radius:50%; background:#fbf2e2; border:2px solid var(--accent);
  box-shadow:0 4px 12px rgba(26,16,9,.18); justify-content:center; align-items:center; font-size:20px; z-index:9999; cursor:pointer;
}
@media (max-width:768px){
  #emMobileCursorBtn{ display:flex; }
  .em-cursor-toolbar{
    top:max(70px, env(safe-area-inset-top) + 62px); right:max(15px, env(safe-area-inset-right) + 8px);
    display:none; flex-wrap:wrap; max-width:210px;
  }
  .em-cursor-toolbar.show{ display:flex; }
}

/* ---- photo grid background mosaic ---- */
.em-photo-grid-bg{
  position:fixed; inset:0; z-index:1; display:grid;
  grid-template-columns:repeat(6,1fr); grid-template-rows:repeat(4,1fr);
  gap:0; padding:0; background:var(--bg); overflow:hidden;
}
.em-photo-grid-cell{ overflow:hidden; background:var(--gold-light); display:flex; align-items:center; justify-content:center; border-radius:0; box-shadow:none; }
.em-photo-grid-cell:nth-child(3n+2){ background:#dcd0b4; }
.em-photo-grid-cell:nth-child(3n+3){ background:#c9b79a; }
.em-photo-grid-cell img{ width:100%; height:100%; object-fit:contain; object-position:center; display:block; filter:sepia(.18) saturate(.9) brightness(1.02); }
.em-photo-grid-overlay{
  position:fixed; inset:0; z-index:2; pointer-events:none;
  background:
    radial-gradient(ellipse at center, rgba(246,239,226,.12) 0%, rgba(246,239,226,.22) 55%, rgba(246,239,226,.36) 100%),
    linear-gradient(180deg, rgba(61,43,30,.05), rgba(61,43,30,.07));
}
#emPageContent{ position:relative; z-index:3; }

@media (max-width:768px){
  .em-photo-grid-bg{ grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(7,1fr); gap:4px; padding:4px; }
  .em-program{ border-radius:16px; padding:22px 18px; }
}
@media (prefers-reduced-motion: reduce){ .em-photo-grid-cell img{ filter:none; } }

@media (max-width:640px){
  .em-curtain-label{ font-size:34px; }
  .em-modal-backdrop{ padding:26px 14px; align-items:center; }
  .em-modal{ max-height:72vh; border-radius:20px; }
  .em-modal-player{ padding:14px 14px 18px; }
  .em-modal-header{ padding:18px 16px 12px; }
  .em-modal-body{ padding:16px 16px; }
}
@media (max-width:420px){
  .em-modal-backdrop{ padding:16px 8px; }
  .em-modal{ max-height:76vh; }
  .em-modal-player{ padding:12px 10px 16px; }
}
</style>

<script>
const emTracks = {
  original: [
    { title:"willow", audio:"audio/willow.mp3" },
    { title:"champagne problems", audio:"audio/champagne-problems.mp3" },
    { title:"gold rush", audio:"audio/gold-rush.mp3" },
    { title:"'tis the damn season", audio:"audio/tis-the-damn-season.mp3" },
    { title:"tolerate it", audio:"audio/tolerate-it.mp3" },
    { title:"no body, no crime", feature:"feat. HAIM", audio:"audio/no-body-no-crime.mp3" },
    { title:"happiness", audio:"audio/happiness.mp3" },
    { title:"dorothea", audio:"audio/dorothea.mp3" },
    { title:"coney island", feature:"feat. The National", audio:"audio/coney-island.mp3" },
    { title:"ivy", audio:"audio/ivy.mp3" },
    { title:"cowboy like me", audio:"audio/cowboy-like-me.mp3" },
    { title:"long story short", audio:"audio/long-story-short.mp3" },
    { title:"marjorie", audio:"audio/marjorie.mp3" },
    { title:"closure", audio:"audio/closure.mp3" },
    { title:"evermore", feature:"feat. Bon Iver", audio:"audio/evermore.mp3" },
    { title:"right where you left me", audio:"audio/right-where-you-left-me.mp3" },
    { title:"it's time to go", audio:"audio/its-time-to-go.mp3" }
  ]
};

Object.keys(emTracks).forEach(function(act){
  emTracks[act].forEach(function(t, i){
    t.id = act + '-' + i;
    if(!t.lyrics) t.lyrics = "[Paste the lyrics for " + t.title + " here]";
  });
});

function renderList(containerId, tracks){
  const el = document.getElementById(containerId);
  el.innerHTML = tracks.map(function(t, i){
    return '<div class="em-track" data-id="' + t.id + '">' +
      '<span class="em-track-num">' + (i+1) + '</span>' +
      '<div class="em-track-info">' +
        '<div class="em-track-title">' + t.title + '</div>' +
        (t.feature ? '<div class="em-track-feature">' + t.feature + '</div>' : '') +
      '</div>' +
      '<span class="em-track-synced" data-synced-label="' + t.id + '">' + (hasSavedSync(t.id) ? 'synced' : '') + '</span>' +
      '<span class="em-track-note">✦</span>' +
    '</div>';
  }).join('');
}

const allTracksById = {};
Object.keys(emTracks).forEach(function(act){
  emTracks[act].forEach(function(t){ allTracksById[t.id] = t; });
});

const emSyncStore = {};
function hasSavedSync(id){ return !!(emSyncStore[id] || (allTracksById[id] && allTracksById[id].timedLyrics)); }
function getSyncFor(id){ return emSyncStore[id] || (allTracksById[id] && allTracksById[id].timedLyrics) || null; }

renderList('list-original', emTracks.original);


const emModalBackdrop = document.getElementById('emModalBackdrop');
const emModalTitle     = document.getElementById('emModalTitle');
const emModalFeature   = document.getElementById('emModalFeature');
const emModalLyrics    = document.getElementById('emModalLyrics');
const emModalAudio     = document.getElementById('emModalAudio');
const emAudioFallback  = document.getElementById('emAudioFallback');

const emSyncStart  = document.getElementById('emSyncStart');
const emSyncMarkBtn= document.getElementById('emSyncMark');
const emSyncUndo   = document.getElementById('emSyncUndo');
const emSyncFinish = document.getElementById('emSyncFinish');
const emSyncClear  = document.getElementById('emSyncClear');
const emSyncHint   = document.getElementById('emSyncHint');
const emSyncStatus = document.getElementById('emSyncStatus');
const emSyncExport = document.getElementById('emSyncExport');

let emLyricLineEls = [];
let emLastActiveIdx = -1;
let emSyncMode = false;
let emSyncTaps = [];
let emCurrentId = null;

/* ---- Equalizer bars ---- */
var VIZ_BAR_COUNT = 18;
var emVizEl = document.getElementById('emVisualizer');
for(var _b=0;_b<VIZ_BAR_COUNT;_b++){
  var bar = document.createElement('div');
  bar.className = 'em-viz-bar';
  bar.style.animationDelay = (_b * 0.09) + 's';
  emVizEl.appendChild(bar);
}

/* ---- Real audio-reactive visualizer (falls back to idle bob) ---- */
var emAudioCtx = null, emAnalyser = null, emAudioSrc = null, emVizBars = null, emVizRAF = null;
function initEmAudioAnalyser(){
  if(emAudioCtx) return true;
  try{
    emAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
    emModalAudio.crossOrigin = "anonymous";
    emAudioSrc = emAudioCtx.createMediaElementSource(emModalAudio);
    emAnalyser = emAudioCtx.createAnalyser();
    emAnalyser.fftSize = 64;
    emAudioSrc.connect(emAnalyser);
    emAnalyser.connect(emAudioCtx.destination);
    emVizBars = Array.from(emVizEl.querySelectorAll('.em-viz-bar'));
    return true;
  } catch(e){
    console.warn('Visualizer: falling back to idle animation (CORS or audio context issue)', e);
    emAudioCtx = null;
    return false;
  }
}
function drawEmVisualizer(){
  emVizRAF = requestAnimationFrame(drawEmVisualizer);
  if(!emAnalyser || emModalAudio.paused) return;
  var data = new Uint8Array(emAnalyser.frequencyBinCount);
  emAnalyser.getByteFrequencyData(data);
  var step = Math.floor(data.length / emVizBars.length) || 1;
  emVizBars.forEach(function(bar, i){
    var v = data[i * step] || 0;
    var pct = Math.max(8, Math.min(95, (v / 255) * 100));
    bar.style.height = pct + '%';
  });
}
emModalAudio.addEventListener('play', function(){
  if(initEmAudioAnalyser()){
    if(emAudioCtx.state === 'suspended') emAudioCtx.resume();
    emVizEl.classList.add('reactive');
    if(!emVizRAF) drawEmVisualizer();
  }
});
emModalAudio.addEventListener('pause', function(){ emVizEl.classList.remove('reactive'); });

/* ---- Particles ---- */
var emParticlesEl = document.getElementById('emParticles');
function spawnParticle(){
  if(emModalAudio.paused || !emModalBackdrop.classList.contains('show')) return;
  var p = document.createElement('span');
  p.className = 'em-particle';
  p.textContent = Math.random() > 0.5 ? '🍂' : '♪';
  p.style.left = (Math.random() * 88 + 4) + '%';
  p.style.fontSize = (11 + Math.random() * 9) + 'px';
  p.style.animationDuration = (3.5 + Math.random() * 2.5) + 's';
  emParticlesEl.appendChild(p);
  setTimeout(function(){ p.remove(); }, 6500);
}
setInterval(spawnParticle, 900);

/* ---- Lyric rendering ---- */
function renderLyricsLines(container, lyricsText){
  container.innerHTML = '';
  emLyricLineEls = [];
  emLastActiveIdx = -1;
  var lines = lyricsText.split('\n');
  var visibleCount = 0;
  lines.forEach(function(line){
    var div = document.createElement('div');
    if(line.trim() === ''){
      div.className = 'em-lyrics-line spacer';
    } else {
      div.className = 'em-lyrics-line';
      div.textContent = line;
      div.style.animationDelay = Math.min(visibleCount * 0.045, 1.4) + 's';
      emLyricLineEls.push(div);
      visibleCount++;
    }
    container.appendChild(div);
  });
}
function clearActiveLyric(){
  emLyricLineEls.forEach(function(el){ el.classList.remove('active','past','sync-target'); });
  emLastActiveIdx = -1;
}
function typeLine(el){
  var text = el.textContent;
  el.innerHTML = '';
  var chars = Array.from(text);
  chars.forEach(function(ch, i){
    var span = document.createElement('span');
    span.className = 'em-ch';
    span.textContent = ch === ' ' ? '\u00A0' : ch;
    span.style.animationDelay = (i * 0.026) + 's';
    el.appendChild(span);
  });
  var cursor = document.createElement('span');
  cursor.className = 'em-cursor-blink';
  cursor.textContent = '▌';
  cursor.style.animationDelay = (chars.length * 0.026) + 's';
  el.appendChild(cursor);
  setTimeout(function(){ if(cursor.parentNode) cursor.remove(); }, chars.length * 26 + 500);
}

var emLastUpdateTime = 0;
function updateActiveLyric(){
  if(emSyncMode) return;
  if(emLyricLineEls.length === 0) return;
  var now = performance.now();
  if(now - emLastUpdateTime < 95) return;
  emLastUpdateTime = now;

  var synced = getSyncFor(emCurrentId);
  var idx;
  if(synced && synced.length){
    idx = 0;
    for(var i=0;i<synced.length;i++){
      if(emModalAudio.currentTime >= synced[i].time) idx = synced[i].index;
      else break;
    }
  } else {
    if(!emModalAudio.duration || !isFinite(emModalAudio.duration)) return;
    var progress = Math.min(1, Math.max(0, emModalAudio.currentTime / emModalAudio.duration));
    idx = Math.min(emLyricLineEls.length - 1, Math.floor(progress * emLyricLineEls.length));
  }
  if(idx === emLastActiveIdx) return;
  emLastActiveIdx = idx;

  emLyricLineEls.forEach(function(el, i){
    el.classList.remove('active','past');
    if(i < idx) el.classList.add('past');
  });
  var activeEl = emLyricLineEls[idx];
  typeLine(activeEl);
  activeEl.classList.add('active');
  activeEl.scrollIntoView({ block:'center', behavior:'smooth' });
}
emModalAudio.addEventListener('timeupdate', updateActiveLyric);
emModalAudio.addEventListener('seeked', function(){ emLastActiveIdx = -1; updateActiveLyric(); });
emModalAudio.addEventListener('play', function(){ emLastActiveIdx = -1; });
emModalAudio.addEventListener('ended', function(){
  var next = getTrackNeighbor(emCurrentId, 1);
  if(next){
    setTimeout(function(){
      loadTrackIntoModal(next, {silent:true});
      emModalAudio.play();
    }, 400);
  }
});

/* ---- Sync tool ---- */
function resetSyncUI(){
  emSyncMode = false; emSyncTaps = [];
  emSyncStart.style.display = 'inline-block';
  emSyncMarkBtn.style.display = 'none';
  emSyncUndo.style.display = 'none';
  emSyncFinish.style.display = 'none';
  emSyncHint.style.display = 'none';
  emSyncStatus.style.display = 'none';
  emSyncExport.style.display = 'none';
  emSyncClear.style.display = hasSavedSync(emCurrentId) ? 'inline-block' : 'none';
  emLyricLineEls.forEach(function(el){ el.classList.remove('sync-target'); });
}
function markSyncTarget(idx){
  emLyricLineEls.forEach(function(el,i){ el.classList.toggle('sync-target', i===idx); });
  if(idx < emLyricLineEls.length) emLyricLineEls[idx].scrollIntoView({ block:'center', behavior:'smooth' });
}

function loadTrackIntoModal(t, opts){
  opts = opts || {};
  if(!t) return;
  if(!opts.silent) emBuzz(10);
  emModalBackdrop.classList.remove('minimized');
  emMiniPlayer.classList.remove('show');

  emCurrentId = t.id;
  emModalTitle.textContent = t.title;
  emModalFeature.textContent = t.feature || '';
  renderLyricsLines(emModalLyrics, t.lyrics);

  emModalAudio.src = t.audio;
  emAudioFallback.style.display = 'none';
  emModalAudio.style.display = 'block';
  emModalAudio.load();
  resetSyncUI();
  emModalBackdrop.classList.add('show');
  updateEmPrevNextState();
}

function getTrackNeighbor(id, dir){
  if(!id) return null;
  var sep = id.lastIndexOf('-');
  var act = id.slice(0, sep);
  var idx = parseInt(id.slice(sep + 1), 10);
  var list = emTracks[act];
  if(!list) return null;
  var newIdx = idx + dir;
  if(newIdx < 0 || newIdx >= list.length) return null;
  return list[newIdx];
}
function updateEmPrevNextState(){
  var prevBtn = document.getElementById('emModalPrev');
  var nextBtn = document.getElementById('emModalNext');
  if(!prevBtn || !nextBtn) return;
  prevBtn.disabled = !getTrackNeighbor(emCurrentId, -1);
  nextBtn.disabled = !getTrackNeighbor(emCurrentId, 1);
}

document.addEventListener('click', function(e){
  var row = e.target.closest('.em-track');
  if(!row) return;
  var t = allTracksById[row.dataset.id];
  if(!t) return;
  loadTrackIntoModal(t);
});

emModalAudio.addEventListener('error', function(){
  emModalAudio.style.display = 'none';
  emAudioFallback.style.display = 'block';
});

function closeEmModal(){
  emModalBackdrop.classList.remove('show');
  emModalAudio.pause();
  clearActiveLyric();
  resetSyncUI();
  emParticlesEl.innerHTML = '';
  emVizEl.classList.remove('reactive');
  if(emVizRAF){ cancelAnimationFrame(emVizRAF); emVizRAF = null; }
}

document.getElementById('emModalPrev').addEventListener('click', function(e){
  e.stopPropagation();
  var prev = getTrackNeighbor(emCurrentId, -1);
  if(prev){ emBuzz(10); loadTrackIntoModal(prev, {silent:true}); }
});
document.getElementById('emModalNext').addEventListener('click', function(e){
  e.stopPropagation();
  var next = getTrackNeighbor(emCurrentId, 1);
  if(next){ emBuzz(10); loadTrackIntoModal(next, {silent:true}); }
});

document.getElementById('emModalClose').addEventListener('click', closeEmModal);
emModalBackdrop.addEventListener('click', function(e){ if(e.target === emModalBackdrop) closeEmModal(); });

/* ---- Share current track ---- */
document.getElementById('emModalShare').addEventListener('click', function(e){
  e.stopPropagation();
  var title = emModalTitle.textContent || 'evermore';
  var shareData = { title: title, text: title + ' · evermore', url: location.href };
  if(navigator.share){
    navigator.share(shareData).catch(function(){});
  } else if(navigator.clipboard){
    navigator.clipboard.writeText(location.href).then(function(){ emShowToast('Link copied ✦'); }).catch(function(){});
  }
});

function emShowToast(msg){
  var t = document.getElementById('emToast');
  if(!t){
    t = document.createElement('div');
    t.id = 'emToast';
    t.className = 'em-toast';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._hideTimer);
  t._hideTimer = setTimeout(function(){ t.classList.remove('show'); }, 1800);
}
function emBuzz(ms){ if(navigator.vibrate) navigator.vibrate(ms || 10); }

/* ---- Swipe-down-to-minimize + persistent mini-player ---- */
var emMiniPlayer = document.getElementById('emMiniPlayer');
var emMiniPlayToggle = document.getElementById('emMiniPlayToggle');
var emMiniTitle = document.getElementById('emMiniTitle');
var emMiniClose = document.getElementById('emMiniClose');
var emMiniInfo = document.getElementById('emMiniInfo');

function minimizeEmModal(){
  if(!emModalBackdrop.classList.contains('show')) return;
  emModalBackdrop.classList.add('minimized');
  emMiniTitle.textContent = emModalTitle.textContent || 'evermore';
  emMiniPlayer.classList.add('show');
  updateMiniPlayIcon();
  emBuzz(8);
}
function restoreEmModal(){
  emModalBackdrop.classList.remove('minimized');
  emMiniPlayer.classList.remove('show');
}
function updateMiniPlayIcon(){ emMiniPlayToggle.textContent = emModalAudio.paused ? '▶' : '❚❚'; }
emModalAudio.addEventListener('play', updateMiniPlayIcon);
emModalAudio.addEventListener('pause', updateMiniPlayIcon);
emMiniPlayToggle.addEventListener('click', function(e){
  e.stopPropagation();
  if(emModalAudio.paused) emModalAudio.play(); else emModalAudio.pause();
  emBuzz(8);
});
emMiniInfo.addEventListener('click', function(){ restoreEmModal(); });
emMiniClose.addEventListener('click', function(e){
  e.stopPropagation();
  restoreEmModal();
  closeEmModal();
});

var _origCloseEmModal = closeEmModal;
closeEmModal = function(){
  emMiniPlayer.classList.remove('show');
  emModalBackdrop.classList.remove('minimized');
  _origCloseEmModal();
};
document.getElementById('emModalClose').removeEventListener('click', _origCloseEmModal);
document.getElementById('emModalClose').addEventListener('click', closeEmModal);

(function(){
  var dragEls = [document.querySelector('.em-modal-header'), document.querySelector('.em-modal-player')];
  var startY = 0, dragging = false, currentEl = null;
  dragEls.forEach(function(el){
    if(!el) return;
    el.addEventListener('touchstart', function(e){
      if(e.touches.length !== 1) return;
      startY = e.touches[0].clientY;
      dragging = true;
      currentEl = document.querySelector('.em-modal');
      if(currentEl) currentEl.style.transition = 'none';
    }, {passive:true});
    el.addEventListener('touchmove', function(e){
      if(!dragging || !currentEl) return;
      var dy = e.touches[0].clientY - startY;
      if(dy > 0) currentEl.style.transform = 'translateY(' + Math.min(dy, 200) + 'px)';
    }, {passive:true});
    el.addEventListener('touchend', function(e){
      if(!dragging || !currentEl) return;
      dragging = false;
      var dy = (e.changedTouches[0].clientY - startY);
      currentEl.style.transition = '';
      currentEl.style.transform = '';
      if(dy > 90) minimizeEmModal();
      currentEl = null;
    });
  });
})();

document.addEventListener('keydown', function(e){
  if(e.key === 'Escape' && !emSyncMode) closeEmModal();
  if(emSyncMode && e.code === 'Space'){ e.preventDefault(); markSyncTap(); }
  if(emSyncMode && e.code === 'Enter'){ e.preventDefault(); finishSync(); }
});

emSyncStart.addEventListener('click', function(){
  if(!emCurrentId) return;
  emSyncMode = true; emSyncTaps = [];
  clearActiveLyric();
  emSyncStart.style.display = 'none';
  emSyncMarkBtn.style.display = 'inline-block';
  emSyncUndo.style.display = 'inline-block';
  emSyncFinish.style.display = 'inline-block';
  emSyncClear.style.display = 'none';
  emSyncHint.style.display = 'block';
  emSyncHint.textContent = 'Hit "Mark line" (or press Space) the instant each line starts. Press Enter or "Finish" when done.';
  emSyncStatus.style.display = 'block';
  emSyncStatus.textContent = 'Line 1 of ' + emLyricLineEls.length;
  markSyncTarget(0);
  emModalAudio.currentTime = 0;
  emModalAudio.play();
});

function markSyncTap(){
  if(!emSyncMode) return;
  var idx = emSyncTaps.length;
  if(idx >= emLyricLineEls.length){ finishSync(); return; }
  emSyncTaps.push({ time: Math.round(emModalAudio.currentTime * 100) / 100, index: idx });
  emSyncStatus.textContent = 'Line ' + (idx+2 <= emLyricLineEls.length ? idx+2 : emLyricLineEls.length) + ' of ' + emLyricLineEls.length;
  if(idx + 1 < emLyricLineEls.length){ markSyncTarget(idx + 1); } else { finishSync(); }
}
emSyncMarkBtn.addEventListener('click', markSyncTap);
emSyncUndo.addEventListener('click', function(){
  if(emSyncTaps.length === 0) return;
  emSyncTaps.pop();
  markSyncTarget(emSyncTaps.length);
  emSyncStatus.textContent = 'Line ' + (emSyncTaps.length+1) + ' of ' + emLyricLineEls.length;
});
function finishSync(){
  emSyncMode = false; emModalAudio.pause();
  if(emSyncTaps.length > 0){
    emSyncStore[emCurrentId] = emSyncTaps.slice();
    var label = document.querySelector('[data-synced-label="' + emCurrentId + '"]');
    if(label) label.textContent = 'synced';
    emSyncExport.style.display = 'block';
    emSyncExport.value = 'timedLyrics: ' + JSON.stringify(emSyncTaps) + ',';
    document.getElementById('emSyncCopy').style.display = 'inline-block';
    emSyncStatus.textContent = 'Saved ✓ — copy the box below into that track object to make it permanent.';
  }
  emSyncStart.style.display = 'inline-block';
  emSyncMarkBtn.style.display = 'none';
  emSyncUndo.style.display = 'none';
  emSyncFinish.style.display = 'none';
  emSyncHint.style.display = 'none';
  emSyncClear.style.display = hasSavedSync(emCurrentId) ? 'inline-block' : 'none';
  emLyricLineEls.forEach(function(el){ el.classList.remove('sync-target'); });
}
emSyncFinish.addEventListener('click', finishSync);
emSyncClear.addEventListener('click', function(){
  delete emSyncStore[emCurrentId];
  var label = document.querySelector('[data-synced-label="' + emCurrentId + '"]');
  if(label && !(allTracksById[emCurrentId] && allTracksById[emCurrentId].timedLyrics)) label.textContent = '';
  emSyncExport.style.display = 'none';
  emSyncClear.style.display = 'none';
  document.getElementById('emSyncCopy').style.display = 'none';
});
document.getElementById('emSyncCopy').addEventListener('click', function(){
  navigator.clipboard.writeText(emSyncExport.value).then(function(){ emShowToast('Copied ✦'); }).catch(function(){});
});

/* ---- Curtain ---- */
var emCurtainOpened = false;
function openCurtain(){
  if(emCurtainOpened) return;
  emCurtainOpened = true;
  document.body.classList.add('em-open');
}
var prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
if(prefersReducedMotion){
  document.getElementById('emCurtain').style.display = 'none';
  emCurtainOpened = true;
} else {
  if(document.readyState === 'complete' || document.readyState === 'interactive'){
    setTimeout(openCurtain, 700);
  } else {
    document.addEventListener('DOMContentLoaded', function(){ setTimeout(openCurtain, 700); });
  }
  setTimeout(openCurtain, 2500);
}
document.getElementById('emReplayCurtain').addEventListener('click', function(){
  emBuzz(10);
  var curtain = document.getElementById('emCurtain');
  var halves = curtain.querySelectorAll('.em-curtain-half');
  halves.forEach(function(h){ h.style.transition = 'none'; });
  document.body.classList.remove('em-open');
  curtain.style.display = 'flex';
  void curtain.offsetWidth;
  halves.forEach(function(h){ h.style.transition = ''; });
  void curtain.offsetWidth;
  emCurtainOpened = false;
  setTimeout(openCurtain, 300);
});

/* ---- Custom cursor + glitter ---- */
(function(){
  const follower      = document.getElementById('emFollower');
  const touchFollower = document.getElementById('emTouchFollower');
  const glitterColors  = ['#8a6d3b','#c9a876','#6b4226','#5c6b4f'];
  const isTouchDevice = () => ('ontouchstart' in window) || navigator.maxTouchPoints > 0;

  const cursorOptions = document.querySelectorAll('.em-cursor-option');
  function applyCursor(name){
    const opt = document.querySelector('.em-cursor-option[data-cursor="' + name + '"]');
    if(!opt) return;
    const src = opt.querySelector('img').getAttribute('src');
    follower.src = src;
    touchFollower.src = src;
    cursorOptions.forEach(o => o.classList.toggle('selected', o === opt));
    try{ localStorage.setItem('emCursorChoice', name); }catch(e){}
  }
  cursorOptions.forEach(function(opt){
    opt.addEventListener('click', function(){ emBuzz(8); applyCursor(opt.dataset.cursor); });
  });
  let savedCursor = 'quill';
  try{ savedCursor = localStorage.getItem('emCursorChoice') || 'quill'; }catch(e){}
  applyCursor(savedCursor);

  const mobileCursorBtn = document.getElementById('emMobileCursorBtn');
  const cursorToolbar = document.getElementById('emCursorToolbar');
  if(mobileCursorBtn){
    mobileCursorBtn.addEventListener('click', function(){ cursorToolbar.classList.toggle('show'); });
    document.addEventListener('click', function(e){
      if(window.innerWidth > 768) return;
      if(!cursorToolbar.contains(e.target) && e.target !== mobileCursorBtn){
        cursorToolbar.classList.remove('show');
      }
    });
  }

  let mouseX = -200, mouseY = -200;
  document.addEventListener('mousemove', (e)=>{ mouseX = e.clientX; mouseY = e.clientY; });
  function updateFollower(){
    follower.style.left = mouseX + 'px';
    follower.style.top  = mouseY + 'px';
    requestAnimationFrame(updateFollower);
  }
  requestAnimationFrame(updateFollower);

  let touchX = -200, touchY = -200;
  function updateTouchFollower(){
    touchFollower.style.left = touchX + 'px';
    touchFollower.style.top  = touchY + 'px';
    requestAnimationFrame(updateTouchFollower);
  }
  requestAnimationFrame(updateTouchFollower);

  function makeGlitterParticle(x, y, isTouch){
    const g = document.createElement('div');
    g.className = isTouch ? 'em-glitter-touch' : 'em-glitter';
    const sizeBase = isTouch ? 9 : 6;
    const spread   = isTouch ? 30 : 22;
    const size     = Math.random() * sizeBase + (isTouch ? 4 : 3);
    g.style.width  = size + 'px';
    g.style.height = size + 'px';
    g.style.left   = (x + (Math.random()-0.5)*spread) + 'px';
    g.style.top    = (y + (Math.random()-0.5)*spread) + 'px';
    const colour = glitterColors[Math.floor(Math.random()*glitterColors.length)];
    g.style.background = colour;
    g.style.clipPath = 'polygon(50% 0%,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0% 50%,39% 39%)';
    g.style.boxShadow = `0 0 6px ${colour}`;
    const flyDist = isTouch ? 46 : 32;
    g.style.setProperty('--tx', (Math.random()-0.5)*flyDist + 'px');
    g.style.setProperty('--ty', (Math.random()-0.5)*flyDist + 'px');
    document.body.appendChild(g);
    setTimeout(()=>g.remove(), isTouch ? 800 : 700);
    if(Math.random() < 0.4){ makeShimmerSpark(x, y, isTouch); }
  }
  function makeShimmerSpark(x, y, isTouch){
    const s = document.createElement('div');
    s.className = 'em-shimmer';
    const spread = isTouch ? 34 : 26;
    const size    = (isTouch ? 7 : 5) + Math.random() * (isTouch ? 6 : 4);
    s.style.width  = size + 'px';
    s.style.height = size + 'px';
    s.style.left   = (x + (Math.random()-0.5)*spread) + 'px';
    s.style.top    = (y + (Math.random()-0.5)*spread) + 'px';
    const colour = Math.random() < 0.5 ? '#c9a876' : '#8a6d3b';
    s.style.background = colour;
    s.style.clipPath = 'polygon(50% 0%,63% 37%,100% 50%,63% 63%,50% 100%,37% 63%,0% 50%,37% 37%)';
    s.style.boxShadow = `0 0 10px ${colour}, 0 0 3px #fff`;
    const flyDist = isTouch ? 40 : 28;
    s.style.setProperty('--tx', (Math.random()-0.5)*flyDist + 'px');
    s.style.setProperty('--ty', (Math.random()-0.5)*flyDist + 'px');
    document.body.appendChild(s);
    setTimeout(()=>s.remove(), 1000);
  }

  let lastMouseGlitter = 0;
  document.addEventListener('mousemove', function(e){
    if(isTouchDevice()) return;
    const now = Date.now();
    if(now - lastMouseGlitter < 90) return;
    lastMouseGlitter = now;
    makeGlitterParticle(e.clientX, e.clientY, false);
  });
  let lastTouchGlitter = 0;
  function spawnTouchGlitter(x, y){
    const now = Date.now();
    if(now - lastTouchGlitter < 160) return;
    lastTouchGlitter = now;
    makeGlitterParticle(x, y, true);
  }
  function handleTouch(e){
    const t = e.touches[0];
    if(!t) return;
    touchX = t.clientX; touchY = t.clientY;
    spawnTouchGlitter(t.clientX, t.clientY);
  }
  document.addEventListener('touchstart', handleTouch, {passive:true});
  document.addEventListener('touchmove',  handleTouch, {passive:true});
})();
</script>
